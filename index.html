<script>
/* 与 storyos 同款首帧登录态判定：已登录首帧即隐藏登录门，不闪登录页 */
(function(){
  try{ if(localStorage.getItem('storyos_token_v1')) document.documentElement.classList.add('authed'); }catch(e){}
})();
</script>
<style>
/* storyos 全局基线：缺了 box-sizing 会让 400px 登录卡片在窄屏溢出、整体偏右（本次「偏移」根因） */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#f2f2f7}
body{font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
/* 进入态：留在原登录卡片内原地切换，不跳转、不新建加载页 */
.wb-enter{display:none}
.v111-login-card.entering .v111-field,
.v111-login-card.entering .v111-submit,
.v111-login-card.entering .v111-aux,
.v111-login-card.entering .v111-login-error{display:none}
.v111-login-card.entering .wb-enter{display:block}
.wb-enter .ttl{font-size:14px;font-weight:600;color:#1c1c1e;text-align:center;line-height:1.7;margin:2px 0 16px}
.wb-track{height:6px;border-radius:6px;background:rgba(60,60,67,.10);overflow:hidden}
.wb-fill{height:100%;width:6%;border-radius:6px;background:linear-gradient(90deg,#a855f7,#7c3aed);transition:width .2s ease}
.wb-msg{margin-top:12px;font-size:12px;color:#8e8e93;line-height:1.6;text-align:center}
.wb-err{margin-top:14px;color:#b3122c;font-size:12.5px;font-weight:700;line-height:1.6;
  background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;padding:12px;display:none;text-align:center}
.wb-err.show{display:block}
</style>
</head>
<body>
<!-- ===== 登录门：逐字克隆 storyos/index.html 的 DOM 契约（v111User/v111Pass/v111LoginError） ===== -->
<div class="login-gate" id="loginGate">
  <section class="v111-login" aria-label="登录">
    <div class="v111-pane on" id="paneLogin">
      <form class="v111-login-card" id="v111LoginForm" autocomplete="on">
        <div class="v111-login-mark">看板</div>
        <h1>会员工作台</h1>
        <label class="v111-field"><span>账号</span><input id="v111User" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label class="v111-field"><span>密码</span><input id="v111Pass" name="password" type="password" autocomplete="current-password" required></label>
        <button class="v111-submit" id="wbSubmit" type="submit">登录</button>
        <div class="v111-login-error" id="v111LoginError" role="alert"></div>
        <div class="v111-aux"><button type="button" class="v111-forgot" id="wbForgot">忘记密码</button></div>
        <!-- 进入态：同一张卡片内，仅首次无本机快照时出现，不是跳转页 -->
        <div class="wb-enter" id="wbEnter">
          <div class="ttl" id="wbEnterTxt">正在进入会员工作台…</div>
          <div class="wb-track"><div class="wb-fill" id="wbFill"></div></div>
          <div class="wb-msg" id="wbMsg"></div>
          <div class="wb-err" id="wbErr"></div>
        </div>
      </form>
    </div>
  </section>
</div>

<script>
/* ===== mms 在线版：与 storyos 同套工作流 =====
   界面在 GitHub Pages CDN（mms_shell.html，零 PII，页面一打开就后台预取）；
   隧道只发 /api/wb/wf 与 /api/wb/qraw 两个数据包；本机 IndexedDB 快照秒出。
   已登录 → 首帧隐藏登录门 → 读快照直接进数据页（无加载页、无跳转）；
   首次登录 → 原登录卡片内原地等待取数，到齐即刻进入，全程不新建中间页面。
   正常态不显示任何角标；仅快照/失败/有新数据时在顶部显示醒目标红（不遮底部菜单）。 */
(function(){
  var API=new URLSearchParams(location.search).get('api')
          || 'https://lijiacun-board.serveousercontent.com';
  var TOKEN_KEY='storyos_token_v1';   /* 与 storyos 同 key，登录一次两站通用 */
  var SYNC_KEY='ljc_sync_token_v1';
  var SHELL_SIG='cacb5fdc0d538d16';  /* build_mms_shell.py 产出；UI 改版时同步更新 */
  var SHELL_URL='./mms_shell.html?v='+SHELL_SIG;
  var SNAP_TTL=24*3600*1000;
  var SNAP_VER=2;   /* v2 = Q 存裸 JSON（注入时才转义），旧 v1 快照必须丢弃 */
  var DB='mms_wb_v1', STORE='snap', KEY='current';
  /* 零 PII 空数据模板：只含键结构，供首登瞬间画出真实主界面框架，绝不显示 0 冒充数据 */
  var EMPTY_W="{\"generatedAt\":\"2026-11-08 08:05\",\"gname\":{\"xl\":\"星联会员\",\"xz\":\"新自由\",\"mb\":\"膜套包\",\"ty\":\"通用现金券\",\"dx\":\"定向现金券\"},\"members\":[],\"emps\":[],\"total\":{\"unpaid\":2082,\"members\":355,\"leftSum\":2484,\"byGroup\":{\"xl\":44,\"mb\":248,\"xz\":4,\"dx\":979,\"ty\":807}},\"promo\":{\"asOf\":\"2026-11-06 21:25\",\"count\":60,\"list\":[{\"name\":\"edge 直降799\",\"start\":\"2026-11-06\",\"end\":\"2026-11-06\",\"n\":1},{\"name\":\"Mate pad Air 官网 直降700\",\"start\":\"2026-11-05\",\"end\":\"2026-11-30\",\"n\":1},{\"name\":\"FreeClip 2潮玩拼色款 官网优惠50元（截至11.14日）\",\"start\":\"2026-11-01\",\"end\":\"2026-11-14\",\"n\":3},{\"name\":\"FreeBuds Pro 4 直降400\",\"start\":\"2026-11-01\",\"end\":\"2026-12-31\",\"n\":3},{\"name\":\"Mate Pad  SE 官网直降300元\",\"start\":\"2026-11-01\",\"end\":\"2026-12-31\",\"n\":2},{\"name\":\"FreeBuds Pro5 官网直降300元\",\"start\":\"2026-11-01\",\"end\":\"2026-11-14\",\"n\":5},{\"name\":\"FreeBuds 7官网直降150（截至11.14）\",\"start\":\"2026-11-01\",\"end\":\"2026-11-14\",\"n\":4},{\"name\":\"FreeBuds Neo官网直降50\",\"start\":\"2026-11-01\",\"end\":\"2026-12-31\",\"n\":6},{\"name\":\"clip2 典藏版商城直降50元\",\"start\":\"2026-11-01\",\"end\":\"2026-11-30\",\"n\":2},{\"name\":\"pad mini官网直降500\",\"start\":\"2026-11-01\",\"end\":\"2026-11-30\",\"n\":1},{\"name\":\"Pura 90 plus 限时直降300(SO激励300）\",\"start\":\"2026-10-31\",\"end\":\"2026-11-30\",\"n\":12},{\"name\":\"畅想100系列立减50（贴膜）\",\"start\":\"2025-12-01\",\"end\":\"2027-12-31\",\"n\":26}]},\"asOf\":{\"coupons\":\"2026-11-08 08:05\",\"cash\":\"2026-11-08 08:05\",\"consumption\":\"2026-11-07\",\"consumptionRows\":8001,\"consumptionBuilt\":\"2026-11-08 08:00\",\"profiles\":\"2026-11-07 08:45\",\"profileHits\":322,\"film\":\"2026-11-07\",\"built\":\"2026-11-08 08:05\",\"health\":{\"runAt\":\"2026-11-08 08:00:00\",\"blocks\":{\"monthly\":{\"label\":\"当月整月回补\",\"status\":\"ok\",\"note\":\"今日非周一，无需当月回补\",\"at\":\"2026-11-08 08:00:00\"},\"retail\":{\"label\":\"消费记录增量\",\"status\":\"ok\",\"note\":\"最近 7 天增量拉取完成\",\"at\":\"2026-11-08 08:00:34\"},\"consumption\":{\"label\":\"消费聚合重算\",\"status\":\"ok\",\"note\":\"本地全量重算完成\",\"at\":\"2026-11-08 08:00:36\"},\"cash\":{\"label\":\"现金券明细\",\"status\":\"ok\",\"note\":\"本轮券实例同步 2211 条，零额外请求\",\"at\":\"2026-11-08 08:05:27\"}},\"updatedAt\":\"2026-11-08 08:05:27\"}}}", EMPTY_F="{\"cfg\":{\"start\":\"\",\"days\":0,\"store_target\":0,\"emp_daily\":0,\"emps\":[],\"end\":\"\",\"daily_target\":0},\"today\":\"\",\"daysData\":[],\"doneTotal\":0,\"remain\":0,\"pct\":0,\"daysLeft\":0,\"avgDone\":0,\"needDaily\":0,\"eta\":\"\",\"empStat\":{\"邵乐乐\":{},\"杨丽华\":{},\"李泽\":{},\"张博晨\":{}},\"genAt\":\"\",\"preDays\":[]}", EMPTY_Q="{\"generatedAt\":\"\",\"store\":\"\",\"gname\":{\"xl\":\"\",\"xz\":\"\",\"mb\":\"\",\"ty\":\"\",\"dx\":\"\",\"other\":\"\"},\"total_members\":0,\"members\":[],\"history\":{},\"history_count\":0,\"asOf\":{\"coupons\":\"\",\"cash\":\"\",\"consumption\":\"\",\"consumptionRows\":0,\"consumptionBuilt\":\"\",\"profiles\":\"\",\"profileHits\":0,\"film\":\"\",\"built\":\"\",\"health\":{}}}";

  function $(id){ return document.getElementById(id); }
  var form=$('v111LoginForm'), err=$('v111LoginError'), user=$('v111User'), pass=$('v111Pass');
  var shellP=null;

  if(new URLSearchParams(location.search).get('expired')==='1')
    err.textContent='登录已过期，请重新登录';
  $('wbForgot').onclick=function(){
    err.textContent='密码与收入看板共用；忘记请联系店长在本机重置。';
  };

  function logout(){
    try{ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(SYNC_KEY); }catch(e){}
    try{ indexedDB.deleteDatabase(DB); }catch(e){}
    location.reload();
  }
  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  /* 与 Python html.escape(quote=True) 逐字一致：Q 存裸 JSON，注入 srcdoc 属性时才转义 */
  function escQ(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
  }
  function sigOf(s){
    var h=5381; for(var i=0;i<s.length;i++){ h=((h*33)^s.charCodeAt(i))>>>0; }
    return h.toString(16);
  }
  function tok(){ try{ return localStorage.getItem(TOKEN_KEY)||''; }catch(e){ return ''; } }

  /* ---- IndexedDB：快照含界面骨架+数据（约 3.3MB），iOS localStorage 会超限 ---- */
  function idb(){
    return new Promise(function(res,rej){
      if(!window.indexedDB){ rej(new Error('no indexedDB')); return; }
      var q=indexedDB.open(DB,1);
      q.onupgradeneeded=function(){
        if(!q.result.objectStoreNames.contains(STORE)) q.result.createObjectStore(STORE);
      };
      q.onsuccess=function(){ res(q.result); };
      q.onerror=function(){ rej(q.error||new Error('idb open fail')); };
    });
  }
  function snapGet(){
    return idb().then(function(db){ return new Promise(function(res,rej){
      var r=db.transaction(STORE,'readonly').objectStore(STORE).get(KEY);
      r.onsuccess=function(){ res(r.result||null); };
      r.onerror=function(){ rej(r.error); };
    }); }).catch(function(){ return null; });
  }
  function snapSet(v){
    return idb().then(function(db){ return new Promise(function(res,rej){
      var t=db.transaction(STORE,'readwrite'); t.objectStore(STORE).put(v,KEY);
      t.oncomplete=function(){ res(true); }; t.onerror=function(){ rej(t.error); };
    }); }).catch(function(){ return false; });
  }
  /* 快照只校验「数据契约版本」+ 时效，不与 UI 指纹绑定：
     界面改版（换 SHELL_SIG）不该把本机已有数据快照判废、逼用户重走 11s 隧道取数。
     shell 每次都用最新 CDN 骨架覆盖，保证界面永远是新版。 */
  function validSnap(s){
    return !!(s && s.ver===SNAP_VER && s.q && s.w && s.f && (Date.now()-s.ts)<SNAP_TTL);
  }

  /* ---- 界面骨架：零 PII，页面一打开就后台预取，无需登录态 ---- */
  function fetchShell(){
    return fetch(SHELL_URL,{cache:'force-cache'}).then(function(r){
      if(!r.ok) throw new Error('界面骨架读取失败（'+r.status+'）');
      return r.text();
    }).then(function(s){
      if(s.indexOf('__INJECT_Q__')<0||s.indexOf('__INJECT_W__')<0||s.indexOf('__INJECT_F__')<0||s.indexOf('</html>')<0)
        throw new Error('界面骨架未就绪');
      return s;
    });
  }
  function prefetchShell(){
    if(!shellP) shellP=fetchShell().catch(function(e){ shellP=null; throw e; });
    return shellP;
  }
  prefetchShell();

  /* ---- 与 storyos doLogin 逐字同款：POST /api/login → token → 进板 ---- */
  function doLogin(ev){
    ev.preventDefault();
    var raw=(user.value||'').trim().replace(/\s+/g,''), p=pass.value||'';
    if(!raw||!p){ err.textContent='请输入账号和密码'; return false; }
    err.textContent='正在验证…';
    $('wbSubmit').disabled=true;
    fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({account:raw,password:p})})
      .then(async function(r){
        var j=await r.json().catch(function(){return {};});
        if(r.status===429){ err.textContent=j.error||'尝试过于频繁，请 1 分钟后再试'; $('wbSubmit').disabled=false; return; }
        if(!r.ok){ err.textContent=j.error||'账号或密码错误，请重新输入'; pass.value=''; pass.focus(); $('wbSubmit').disabled=false; return; }
        err.textContent='';
        try{ localStorage.setItem(TOKEN_KEY,j.token); localStorage.setItem(SYNC_KEY,j.token); }catch(e){}
        boot(j.token);
        pass.value='';
      }).catch(function(){ err.textContent='数据服务连接失败，请检查网络后重试'; $('wbSubmit').disabled=false; });
    return false;
  }

  /* ---- 进入态：同一张登录卡片内，不跳页 ---- */
  function enter(txt){
    document.documentElement.classList.remove('authed');
    form.classList.add('entering');
    $('wbEnterTxt').textContent=txt||'正在进入会员工作台…';
    $('wbErr').classList.remove('show'); $('wbErr').textContent='';
    $('wbFill').style.width='8%'; $('wbMsg').textContent='';
  }
  function prog(n){ $('wbFill').style.width=n+'%'; }
  function fail(e){
    var msg=(e&&e.message)||String(e||'未知错误');
    if(/过期|401|失效/.test(msg)){
      try{ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(SYNC_KEY); }catch(_){}
      document.documentElement.classList.remove('authed');
      form.classList.remove('entering');
      $('wbSubmit').disabled=false;
      err.textContent='登录已过期，请重新登录';
      return;
    }
    enter('未能进入工作台');
    prog(0);
    var box=$('wbErr');
    box.textContent='⚠ '+msg+'（本轮未拿旧数据冒充新数据）';
    box.classList.add('show');
    if(!$('wbRetry')){
      var b=document.createElement('button'); b.id='wbRetry'; b.type='button';
      b.className='v111-submit'; b.style.marginTop='12px'; b.textContent='重试';
      b.onclick=function(){ location.reload(); };
      box.appendChild(document.createElement('br')); box.appendChild(b);
    }
  }

  function chk(r){
    if(r.status===401){
      try{ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(SYNC_KEY); }catch(e){}
      throw new Error('登录已过期，请重新登录');
    }
    if(!r.ok) throw new Error('数据读取失败（'+r.status+'）');
    return r;
  }
  /* 免费隧道偶发挂起/断流：给每个请求加硬超时，超时即失败重试，绝不无限转圈 */
  function fetchT(url, ms){
    var ctl=(typeof AbortController==='function')?new AbortController():null;
    var tm=ctl?setTimeout(function(){ try{ ctl.abort(); }catch(e){} },ms||60000):null;
    var opt=ctl?{cache:'no-store',signal:ctl.signal}:{cache:'no-store'};
    return fetch(url,opt).then(function(r){ if(tm) clearTimeout(tm); return r; },
                              function(e){ if(tm) clearTimeout(tm); throw e; });
  }
  function fetchData(token){
    var t=encodeURIComponent(token), u=API+'/api/wb/';
    var a=fetchT(u+'wf?token='+t,60000).then(chk).then(function(r){return r.json();});
    var b=fetchT(u+'qraw?token='+t,60000).then(chk).then(function(r){return r.text();});
    return Promise.all([a,b]).then(function(p){
      var wf=p[0], q=p[1];
      if(!wf||!wf.ok||!wf.w||!wf.f) throw new Error('总览数据不完整');
      if(!q||q.charAt(0)!=='{') throw new Error('会员数据不完整');
      return {q:q,w:wf.w,f:wf.f,shim:wf.shim||'',generatedAt:wf.generatedAt||'',asOf:wf.asOf||{}};
    });
  }
  /* 与 storyos 同款 1.5s 退避重试一次（登录失效不重试，直接回登录页） */
  function fetchDataRetry(token){
    return fetchData(token).catch(function(e){
      if(/过期|401|失效/.test((e&&e.message)||'')) throw e;
      $('wbMsg').textContent='隧道抖动，正在自动重试…';
      return new Promise(function(r){ setTimeout(r,1500); }).then(function(){
        $('wbMsg').textContent='重新连接本机服务…';
        return fetchData(token);
      });
    });
  }

  /* ---- 统一入口：有有效快照就零等待直接进数据页；否则原卡片内取数 ---- */
  function boot(token){
    return snapGet().then(function(snap){
      if(validSnap(snap)){
        /* 老用户/重新登录：本机数据快照 + 最新 CDN 骨架 = 点完登录直接进主界面 */
        return prefetchShell().catch(function(){ return snap.shell||null; }).then(function(shell){
          if(!shell) throw new Error('界面骨架未就绪');
          snap.shell=shell; snap.sig=SHELL_SIG;
          /* 框架页刚拉回来的就是本轮真数据，别再挂「当前显示旧数据」的灰条 */
          var justNow=!!(snap.justFetched && (Date.now()-snap.ts)<10000);
          render(snap, token, justNow);
        });
      }
      /* 全新设备：不再停在登录卡片上等隧道。先把真实主界面框架画出来（顶栏/四 Tab/主题条都在），
         框架页自己后台取数 → 写本机快照 → 刷新一次即为完整数据页。失败显式标红不冒充。 */
      return prefetchShell().then(function(shell){ renderFrame(shell, token); });
    }).catch(fail);
  }

  /* ---- 注入新文档的引导脚本：后台校验鲜数据 + 顶部异常条 + 退出 ----
         序列化函数体执行，不能引用本闭包任何变量，全部由 cfg 传入。 */
  function wbBoot(cfg){
    var API=cfg.api, TOK=cfg.tok, FRESH=cfg.fresh, STAMP=cfg.stamp,
        QSIG=cfg.qsig, SIG=cfg.sig, DB=cfg.db, STORE=cfg.store, KEY=cfg.key;
    window.__WB_ONLINE__=true; window.__WB_TOKEN__=TOK; window.__WB_API__=API;
    /* 顶部条：正常态不创建；只有旧快照/失败/有新数据才出现，绝不遮底部导航 */
    function bar(txt,color,clickable){
      var el=document.getElementById('wbFresh');
      if(!el){
        el=document.createElement('div'); el.id='wbFresh';
        el.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99998;'
          +'padding:6px 12px;text-align:center;font-size:11.5px;line-height:1.5;'
          +'background:#fff;border-bottom:1px solid #e5e5ea;box-shadow:0 2px 8px rgba(0,0,0,.05)';
        (document.body||document.documentElement).appendChild(el);
      }
      el.textContent=txt; el.style.color=color; el.style.display='block';
      el.style.cursor=clickable?'pointer':'default';
      el.onclick=clickable?function(){ location.reload(); }:null;
    }
    function hideBar(){ var el=document.getElementById('wbFresh'); if(el) el.style.display='none'; }
    function sigOf(s){ var h=5381; for(var i=0;i<s.length;i++){ h=((h*33)^s.charCodeAt(i))>>>0; } return h.toString(16); }
    function idb(){ return new Promise(function(res,rej){
      if(!window.indexedDB){ rej(new Error('no idb')); return; }
      var q=indexedDB.open(DB,1);
      q.onupgradeneeded=function(){ if(!q.result.objectStoreNames.contains(STORE)) q.result.createObjectStore(STORE); };
      q.onsuccess=function(){ res(q.result); }; q.onerror=function(){ rej(q.error); };
    }); }
    function snapGet(){ return idb().then(function(db){ return new Promise(function(res,rej){
      var r=db.transaction(STORE,'readonly').objectStore(STORE).get(KEY);
      r.onsuccess=function(){ res(r.result||null); }; r.onerror=function(){ rej(r.error); };
    }); }).catch(function(){ return null; }); }
    function snapSet(v){ return idb().then(function(db){ return new Promise(function(res,rej){
      var t=db.transaction(STORE,'readwrite'); t.objectStore(STORE).put(v,KEY);
      t.oncomplete=function(){ res(true); }; t.onerror=function(){ rej(t.error); };
    }); }).catch(function(){ return false; }); }
    function mount(){
      var m=document.getElementById('main')||document.body;
      var btn=document.createElement('button');
      btn.textContent='退出';
      btn.style.cssText='position:fixed;top:8px;right:8px;z-index:99999;padding:5px 10px;border:0;border-radius:12px;background:rgba(124,58,237,.92);color:#fff;font-size:11.5px;font-weight:600;line-height:1.4;cursor:pointer';
      btn.onclick=function(){
        try{ localStorage.removeItem(cfg.tk); localStorage.removeItem(cfg.sk); }catch(e){}
        try{ indexedDB.deleteDatabase(DB); }catch(e){}
        location.href=location.origin+location.pathname;
      };
      if(m) m.appendChild(btn);
      /* 正常拉到真数据：完全不显示角标；快照态才明示真实时刻 */
      if(!FRESH) bar('当前显示 '+STAMP+' 数据 · 正在校验更新…','#8e8e93');
    }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mount); else mount();
    if(FRESH) return;
    var t=encodeURIComponent(TOK), u=API+'/api/wb/';
    function chk(r){ if(r.status===401) throw new Error('登录已失效'); if(!r.ok) throw new Error(r.status); return r; }
    Promise.all([
      fetch(u+'wf?token='+t,{cache:'no-store'}).then(chk).then(function(r){ return r.json(); }),
      fetch(u+'qraw?token='+t,{cache:'no-store'}).then(chk).then(function(r){ return r.text(); })
    ]).then(function(p){
      var wf=p[0], q=p[1];
      if(!wf||!wf.ok||!wf.w||!q||q.charAt(0)!=='{') throw new Error('数据不完整');
      var ns=sigOf(q), stamp=wf.generatedAt||'';
      return snapGet().then(function(s){
        if(s && s.ver===cfg.ver){
          s.q=q; s.w=wf.w; s.f=wf.f; s.shim=wf.shim||'';
          s.generatedAt=stamp; s.asOf=wf.asOf||{}; s.qsig=ns; s.ts=Date.now();
          return snapSet(s);
        }
        return false;
      }).then(function(){
        if(ns!==QSIG || stamp!==STAMP){
          bar('已获取 '+stamp+' 新数据 · 点此刷新','#b3122c',true);
        }else{
          hideBar();   /* 核验一致：不再显示「数据已核验」卡片 */
        }
      });
    }).catch(function(){
      bar('本轮更新失败 · 当前显示 '+STAMP+' 数据，未拿新数据冒充','#b3122c');
    });
  }


  /* ---- 主界面框架页的引导脚本（序列化注入新文档，不引用本闭包变量） ----
     职责单一：后台取真数据 → 写 IndexedDB 快照 → reload 回登录壳走已验证的秒进路径。 */
  function frameBoot(cfg){
    var API=cfg.api, TOK=cfg.tok, VER=cfg.ver, SIG=cfg.sig,
        DB=cfg.db, STORE=cfg.store, KEY=cfg.key;
    function $(id){ return document.getElementById(id); }
    function msg(t,red){ var e=$('wbFrameMsg'); if(e){ e.textContent=t; e.style.color=red?'#b3122c':'#6e6e73'; } }
    function prog(n){ var e=$('wbFrameFill'); if(e) e.style.width=n+'%'; }
    function ft(url,ms){
      var ctl=(typeof AbortController==='function')?new AbortController():null;
      var tm=ctl?setTimeout(function(){ try{ ctl.abort(); }catch(e){} },ms||60000):null;
      return fetch(url,ctl?{cache:'no-store',signal:ctl.signal}:{cache:'no-store'})
        .then(function(r){ if(tm) clearTimeout(tm); return r; },
              function(e){ if(tm) clearTimeout(tm); throw e; });
    }
    function chk(r){
      if(r.status===401){ try{ localStorage.removeItem(cfg.tk); localStorage.removeItem(cfg.sk); }catch(e){} throw new Error('登录已过期，请重新登录'); }
      if(!r.ok) throw new Error('数据读取失败（'+r.status+'）');
      return r;
    }
    function sigOf(s){ var h=5381; for(var i=0;i<s.length;i++){ h=((h*33)^s.charCodeAt(i))>>>0; } return h.toString(16); }
    function idb(){ return new Promise(function(res,rej){
      var q=indexedDB.open(DB,1);
      q.onupgradeneeded=function(){ if(!q.result.objectStoreNames.contains(STORE)) q.result.createObjectStore(STORE); };
      q.onsuccess=function(){ res(q.result); }; q.onerror=function(){ rej(q.error); };
    }); }
    function save(v){ return idb().then(function(db){ return new Promise(function(res,rej){
      var t=db.transaction(STORE,'readwrite'); t.objectStore(STORE).put(v,KEY);
      t.oncomplete=function(){ res(true); }; t.onerror=function(){ rej(t.error); };
    }); }); }
    function once(){
      var t=encodeURIComponent(TOK), u=API+'/api/wb/';
      return Promise.all([
        ft(u+'wf?token='+t,60000).then(chk).then(function(r){ return r.json(); }),
        ft(u+'qraw?token='+t,60000).then(chk).then(function(r){ return r.text(); })
      ]).then(function(p){
        var wf=p[0], q=p[1];
        if(!wf||!wf.ok||!wf.w||!wf.f) throw new Error('总览数据不完整');
        if(!q||q.charAt(0)!=='{') throw new Error('会员数据不完整');
        return { ver:VER, ts:Date.now(), sig:SIG, q:q, w:wf.w, f:wf.f, justFetched:true,
                 shim:wf.shim||'', generatedAt:wf.generatedAt||'', asOf:wf.asOf||{}, qsig:sigOf(q) };
      });
    }
    function showErr(e){
      prog(0);
      msg('⚠ '+((e&&e.message)||e)+'（本轮未拿旧数据冒充）',true);
      if(!$('wbFrameRetry')){
        var b=document.createElement('button'); b.id='wbFrameRetry'; b.type='button'; b.textContent='重试';
        b.style.cssText='display:block;margin:14px auto 0;padding:9px 22px;border:0;border-radius:20px;background:#7c3aed;color:#fff;font-size:13px;font-weight:600;cursor:pointer';
        b.onclick=function(){ location.reload(); };
        var m=$('wbFrameMsg'); if(m&&m.parentNode) m.parentNode.appendChild(b);
      }
    }
    function go(){
      var ex=$('wbFrameExit');
      if(ex) ex.onclick=function(){
        try{ localStorage.removeItem(cfg.tk); localStorage.removeItem(cfg.sk); }catch(e){}
        try{ indexedDB.deleteDatabase(DB); }catch(e){}
        location.href=location.origin+location.pathname;
      };
      prog(15); msg('正在从本机取会员数据…');
      once().catch(function(e){
        if(/过期|401/.test((e&&e.message)||'')) throw e;
        msg('隧道抖动，正在自动重试…');
        return new Promise(function(r){ setTimeout(r,1500); }).then(once);
      }).then(function(v){
        prog(80);
        return save(v).then(function(){ prog(100); location.reload(); });
      }).catch(showErr);
    }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',go); else go();
  }

  function renderFrame(shell, token){
    var h=shell.split('__INJECT_Q__').join(escQ(EMPTY_Q))
               .split('__INJECT_W__').join(EMPTY_W)
               .split('__INJECT_F__').join(EMPTY_F);
    var cfg={ api:API, tok:token, ver:SNAP_VER, sig:SHELL_SIG, db:DB, store:STORE, key:KEY,
              tk:TOKEN_KEY, sk:SYNC_KEY };
    var init='window.__WB_ONLINE__=true;window.__WB_TOKEN__='+JSON.stringify(token)
            +';window.__WB_API__='+JSON.stringify(API)+';';
    /* 半透明遮罩只盖内容区：顶栏与底部四 Tab 保持可见；不显示任何 0，避免冒充真实数据 */
    var mask='<div id="wbFrameMask" style="position:fixed;left:0;right:0;top:47px;bottom:52px;z-index:9999;'
      +'background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;padding:24px">'
      +'<div style="width:min(100%,340px);text-align:center">'
      +'<div style="font-size:15px;font-weight:700;color:#1c1c1e;margin-bottom:8px">会员工作台</div>'
      +'<div id="wbFrameMsg" style="font-size:12.5px;color:#6e6e73;line-height:1.7">正在从本机取会员数据…</div>'
      +'<div style="height:6px;border-radius:6px;background:rgba(60,60,67,.10);overflow:hidden;margin-top:16px">'
      +'<div id="wbFrameFill" style="height:100%;width:8%;border-radius:6px;background:linear-gradient(90deg,#a855f7,#7c3aed);transition:width .2s"></div></div>'
      +'<button id="wbFrameExit" type="button" style="margin-top:18px;border:0;background:none;color:#7c3aed;font-size:12.5px;font-weight:600;cursor:pointer">退出</button>'
      +'</div></div>';
    h=h.replace('<head>','<head><scr'+'ipt>'+init+'<\/scr'+'ipt>',1);
    h=h.replace(/<body[^>]*>/,function(m){ return m+mask; });
    var boot='<scr'+'ipt>('+frameBoot.toString()+')('+JSON.stringify(cfg)+');<\/scr'+'ipt>';
    h=h.replace('<head>','<head>'+boot,1);
    history.replaceState(null,'','?api='+encodeURIComponent(API));
    document.open(); document.write(h); document.close();
  }

  function buildHtml(snap, cfg){
    var h=snap.shell
      .split('__INJECT_Q__').join(escQ(snap.q))
      .split('__INJECT_W__').join(snap.w)
      .split('__INJECT_F__').join(snap.f);
    var pos=h.lastIndexOf('&lt;/body&gt;');
    if(pos>0 && snap.shim) h=h.slice(0,pos)+snap.shim+h.slice(pos);
    var boot='<scr'+'ipt>('+wbBoot.toString()+')('+JSON.stringify(cfg)+');<\/scr'+'ipt>';
    return h.replace('<head>','<head>'+boot,1);
  }

  function render(snap, token, fresh){
    var cfg={ api:API, tok:token, fresh:fresh, stamp:snap.generatedAt||'未知时刻',
              qsig:snap.qsig||'', sig:SHELL_SIG, ver:SNAP_VER, db:DB, store:STORE, key:KEY,
              tk:TOKEN_KEY, sk:SYNC_KEY };
    var html=buildHtml(snap,cfg);
    history.replaceState(null,'','?api='+encodeURIComponent(API));
    document.open(); document.write(html); document.close();
  }

  form.addEventListener('submit', doLogin);
  var saved=tok();
  if(saved) boot(saved);   /* 已登录：登录门首帧即隐藏，直接进数据页 */
})();
</script>
</body>
</html>
