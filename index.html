<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>会员工作台 · 登录</title>
<link rel="icon" href="data:,">
<style>
/* ===== 以下为 storyos 登录门样式（逐字克隆，内联以便 GitHub Pages 自包含） ===== */
.login-gate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(180deg,#fafafa 0%,#f2f2f7 52%,#e9e9ee 100%);}
.login-gate.hide{display:none}
html.authed .login-gate{display:none!important}
.v111-login{width:100%;display:flex;align-items:center;justify-content:center}
.v111-login-card{width:min(100%,400px);margin:0 auto;padding:34px 28px 24px;
  background-color:rgba(248,248,250,.78);
  background-image:linear-gradient(145deg,rgba(255,255,255,.94),rgba(247,247,249,.76) 54%,rgba(242,242,247,.72));
  border:1px solid rgba(255,255,255,.96);border-radius:34px;
  box-shadow:0 18px 46px rgba(0,0,0,.09),0 3px 9px rgba(0,0,0,.035),inset 0 1.5px 0 #fff,inset 0 -1px 0 rgba(60,60,67,.10);
  backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);}
.v111-login-mark{width:64px;height:64px;margin:0 auto 20px;border-radius:21px;font-size:17px;font-weight:600;
  display:grid;place-items:center;color:#fff;border:1px solid rgba(255,255,255,.62);
  background:linear-gradient(155deg,#64d2ff,#0a84ff 50%,#0071e3);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.72),0 8px 20px rgba(0,122,255,.20);}
.v111-login h1{font-size:26px;text-align:center;font-weight:650;letter-spacing:-.8px;margin:0 0 26px;color:#1c1c1e;}
.v111-field{display:block;margin-top:17px;}
.v111-field span{display:block;font-size:13px;color:#6e6e73;margin:0 0 7px 5px;}
.v111-field input{width:100%;height:54px;border:1px solid rgba(60,60,67,.12);border-radius:17px;padding:0 16px;
  background:rgba(255,255,255,.74);color:#1c1c1e;font-size:17px;outline:none;
  box-shadow:inset 0 1px 2px rgba(15,23,42,.035),inset 0 1px 0 rgba(255,255,255,.88);
  transition:border-color .2s ease,box-shadow .2s ease,background-color .2s ease;}
.v111-field input:focus{background:#fff;border-color:rgba(0,122,255,.48);
  box-shadow:0 0 0 3px rgba(0,122,255,.10),inset 0 1px 0 #fff;}
.v111-submit{width:100%;min-height:52px;margin-top:26px;border:1px solid rgba(255,255,255,.48);border-radius:27px;
  background:linear-gradient(180deg,#168cff,#007aff);cursor:pointer;font:inherit;font-weight:600;color:#fff;
  box-shadow:0 8px 20px rgba(0,122,255,.22),inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,72,158,.22);}
.v111-submit:active{background:linear-gradient(180deg,#0a7fea,#006ee6);}
.v111-login-error{min-height:22px;margin-top:14px;text-align:center;color:#bf3e49;font-size:13px;}
.v111-aux{display:flex;justify-content:center;margin-top:6px}
.v111-forgot{appearance:none;background:none;border:none;cursor:pointer;font:inherit;
  font-size:13.5px;font-weight:500;color:#007aff;padding:8px 6px;letter-spacing:.2px}
.v111-forgot:active{opacity:.55}
.v111-pane{display:none;width:100%}
.v111-pane.on{display:block;animation:v111paneIn .28s cubic-bezier(.32,.72,.35,1)}
@keyframes v111paneIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.v111-ok{min-height:22px;margin-top:14px;text-align:center;color:#1d8a4e;font-size:13px;font-weight:600}
.v111-ok::before{content:"✓ ";font-weight:700}
.v111-login{
  --lg-brand:#7c3aed; --lg-brand2:#a855f7; --lg-brand-deep:#6d28d9;
}
.v111-login-mark{
  background:linear-gradient(155deg,var(--lg-brand2),var(--lg-brand) 50%,var(--lg-brand-deep));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.72),0 8px 20px rgba(124,58,237,.26);
}
.v111-submit{
  background:linear-gradient(180deg,#8b5cf6,#7c3aed);
  box-shadow:0 8px 20px rgba(124,58,237,.26),inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(76,29,149,.22);
}
.v111-submit:active{background:linear-gradient(180deg,#7c3aed,#6d28d9)}
.v111-field input:focus{
  border-color:rgba(124,58,237,.48);
  box-shadow:0 0 0 3px rgba(124,58,237,.10),inset 0 1px 0 #fff;
}
.v111-forgot{color:#7c3aed}
.v111-submit{min-height:52px}
.v111-login :where(input,button):focus-visible{
  outline:2px solid #7c3aed;outline-offset:2px;
}

/* ===== mms 加载态（与登录门同款玻璃卡片） ===== */
.wb-foot{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));
  z-index:1000;text-align:center;font-size:11.5px;line-height:1.7;color:#8e8e93;padding:0 20px}
.wb-load{position:fixed;inset:0;z-index:998;display:none;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(180deg,#fafafa 0%,#f2f2f7 52%,#e9e9ee 100%);}
.wb-load.show{display:flex}
.wb-track{height:8px;border-radius:8px;background:rgba(60,60,67,.10);overflow:hidden;margin-top:18px}
.wb-fill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#a855f7,#7c3aed);transition:width .18s ease}
.wb-num{font-size:12px;color:#6e6e73;margin-top:12px;font-variant-numeric:tabular-nums;text-align:center}
.wb-err{margin-top:16px;color:#b3122c;font-size:12.5px;font-weight:700;line-height:1.6;
  background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;padding:12px;display:none}
.wb-err.show{display:block}
</style>
</head>
<body>
<!-- 登录门：与收入看板（storyos）逐字同款，样式直接引用同一个 login.css -->
<div class="login-gate" id="loginGate">
  <section class="v111-login" aria-label="登录">
    <div class="v111-pane on">
      <form class="v111-login-card" id="wbLoginForm" autocomplete="on">
        <div class="v111-login-mark">看板</div>
        <h1>会员工作台</h1>
        <label class="v111-field"><span>账号</span><input id="wbUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="与收入看板同一账号"></label>
        <label class="v111-field"><span>密码</span><input id="wbPass" name="password" type="password" autocomplete="current-password" required></label>
        <button class="v111-submit" id="wbSubmit" type="submit">登录</button>
        <div class="v111-login-error" id="wbError" role="alert"></div>
        <div class="v111-aux"><button type="button" class="v111-forgot" id="wbForgot">忘记密码？</button></div>
      </form>
    </div>
  </section>
</div>
<div class="wb-foot">与收入看板使用同一套账号密码 · 会员明细只存在本机，登录后由本机服务下发</div>

<div class="wb-load" id="loadView">
  <section class="v111-login" aria-label="加载中">
    <div class="v111-pane on">
      <div class="v111-login-card" style="text-align:center">
        <div class="v111-login-mark">看板</div>
        <h1 style="margin:0 0 14px">会员工作台</h1>
        <div id="wbSub" style="font-size:13px;color:#6e6e73;line-height:1.6">正在从本机加载会员数据…</div>
        <div class="wb-track"><div class="wb-fill" id="wbFill"></div></div>
        <div class="wb-num" id="wbNum">连接中</div>
        <div class="wb-err" id="wbErr"></div>
        <button type="button" class="v111-forgot" id="wbLogout" style="margin-top:16px">退出登录</button>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  var API='https://lijiacun-board.serveousercontent.com';
  var TOKEN_KEY='wb_token_v1';
  var SYNC_KEY='ljc_sync_token_v1';
  var form=document.getElementById('wbLoginForm'),
      err=document.getElementById('wbError'),
      btn=document.getElementById('wbSubmit'),
      user=document.getElementById('wbUser'),
      pass=document.getElementById('wbPass'),
      loginGate=document.getElementById('loginGate'),
      loadView=document.getElementById('loadView'),
      wbSub=document.getElementById('wbSub'),
      wbFill=document.getElementById('wbFill'),
      wbNum=document.getElementById('wbNum'),
      wbErr=document.getElementById('wbErr'),
      wbLogout=document.getElementById('wbLogout');

  if(new URLSearchParams(location.search).get('expired')==='1')
    err.textContent='登录已过期，请重新登录';
  document.getElementById('wbForgot').onclick=function(){
    err.textContent='密码与收入看板共用；忘记请联系店长在本机重置，或登录后由店长在「改密」里处理。';
  };
  wbLogout.onclick=function(){
    try{ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(SYNC_KEY); }catch(e){}
    location.reload();
  };

  function startLoad(token){
    try{ localStorage.setItem(TOKEN_KEY,token); localStorage.setItem(SYNC_KEY,token); }catch(e){}
    loginGate.classList.add('hide'); loadView.classList.add('show');
    wbErr.classList.remove('show'); wbErr.textContent='';
    loadData(token).catch(function(e){ showErr(e.message||String(e)); });
  }
  function showErr(msg){
    wbErr.textContent='⚠ '+msg; wbErr.classList.add('show');
    var b=document.createElement('button');
    b.textContent='重新加载'; b.className='v111-submit'; b.style.marginTop='12px';
    b.onclick=function(){ location.reload(); };
    wbErr.appendChild(document.createElement('br')); wbErr.appendChild(b);
  }

  function loadData(token){
    return fetch(API+'/api/wb/manifest?token='+encodeURIComponent(token),{cache:'no-store'})
      .then(function(r){
        if(r.status===401){ try{localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(SYNC_KEY);}catch(e){} throw new Error('登录已失效，请重新登录'); }
        if(!r.ok) throw new Error('清单读取失败（'+r.status+'）');
        return r.json();
      })
      .then(function(m){
        if(!m.chunks||m.chunks<1) throw new Error('清单无有效分片');
        var parts=new Array(m.chunks), done=0, queue=[];
        for(var i=0;i<m.chunks;i++) queue.push(i);
        function paint(){ wbFill.style.width=(done/m.chunks*100).toFixed(1)+'%'; wbNum.textContent='已加载 '+done+' / '+m.chunks+' 片'; }
        function fetchChunk(i){
          var tries=3,k=0;
          function attempt(){ return fetch(API+'/api/wb/chunk?i='+i+'&token='+encodeURIComponent(token),{cache:'no-store'})
            .then(function(q){
              if(q.status===401){ try{localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(SYNC_KEY);}catch(e){} throw new Error('登录已失效，请重新登录'); }
              if(!q.ok) throw new Error('第 '+i+' 片状态 '+q.status);
              return q.text();
            }); }
          function loop(){ return attempt().catch(function(e){ if(k++<tries-1) return new Promise(function(r){setTimeout(r,600*(k+1));}).then(loop); throw e; }); }
          return loop();
        }
        async function worker(){ while(queue.length){ var i=queue.shift(); parts[i]=await fetchChunk(i); done++; paint(); } }
        return Promise.all([worker(),worker()]).then(function(){
          var html=parts.join('');
          if(html.indexOf('</html>')<0) throw new Error('页面数据不完整');
          if(html.indexOf('__DATA_W__')>=0) throw new Error('页面数据未注入');
          // 让内嵌页的同步层(SYNC_API)指向本机隧道，而非 GitHub Pages 域名
          history.replaceState(null,'','?api='+encodeURIComponent(API));
          var boot='<scr'+'ipt>window.__WB_ONLINE__=true;window.__WB_TOKEN__='
            +JSON.stringify(token)+';'
            +'(function(){var b=document.createElement("button");b.textContent="退出登录";'
            +'b.style.cssText="position:fixed;top:8px;right:8px;z-index:99999;padding:8px 14px;border:0;'
            +'border-radius:18px;background:#7c3aed;color:#fff;font-size:13px;font-weight:600;cursor:pointer";'
            +'b.onclick=function(){try{localStorage.removeItem("'+TOKEN_KEY+'");localStorage.removeItem("'+SYNC_KEY+'");}catch(e){}'
            +'location.href=location.origin+location.pathname;};'
            +'document.addEventListener("DOMContentLoaded",function(){'
            +'var m=document.getElementById("main")||document.body; if(m) m.appendChild(b);});})();<\/scr'+'ipt>';
          html=html.replace('<head>','<head>'+boot,1);
          wbSub.textContent='加载完成，正在打开…';
          document.open(); document.write(html); document.close();
        });
      });
  }

  form.addEventListener('submit', function(ev){
    ev.preventDefault(); err.textContent='';
    var u=user.value.trim(), p=pass.value;
    if(!u||!p){ err.textContent='请输入账号和密码'; return; }
    btn.disabled=true; btn.textContent='登录中…';
    (async function(){
      try{
        var r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({account:u,password:p}),cache:'no-store'});
        var j=await r.json();
        if(!r.ok||!j.token){ err.textContent=j.error||'账号或密码错误'; pass.value=''; return; }
        startLoad(j.token);
      }catch(e){ err.textContent='连不上服务，请检查网络或隧道是否在线'; }
      finally{ btn.disabled=false; btn.textContent='登录'; }
    })();
  });

  // 启动：有已存 token 直接进，否则显示登录
  var saved=null; try{ saved=localStorage.getItem(TOKEN_KEY); }catch(e){}
  if(saved){ startLoad(saved); }
})();
</script>
</body>
</html>
