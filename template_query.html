<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>会员权益查询 · 李家村万达</title>
<style>
/* ==========================================================================
   会员查询 · 统一设计系统 v3（2026-11-06）
   单一交互主色(门店紫) / 语义色只用于状态 / 白卡无渐变 /
   8px 间距体系 / 4 档字号 / 分区标题与锚点建立层级
   规则来源：Ant Design 官方 Token、微信小程序设计规范、钉钉工作台分栏规范、
             京东/美团筛选分层、金蝶 CRM 详情页四件套、企微侧边栏工作台
   ========================================================================== */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#FAFBFC;
  --line:#E8EAF0; --line2:#DCE0E9;
  --tx:#1C2030; --tx2:#5C6474; --tx3:#98A0AF;
  --brand:#7C3AED; --brand2:#9D6BF5; --brand-soft:#F2ECFF; --brand-line:#E3D6FF;
  --danger:#E5484D; --danger-soft:#FFF0F1; --danger-line:#F9D2D5;
  --warn:#9b9aa6; --warn-soft:#EEF0F4;
  --ok:#12A87A; --ok-soft:#EAF9F3;
  --info:#6B7280; --info-soft:#EEF0F4;
  --oth:#6B7280;
  /* 兼容旧变量名，保证 JS 生成的 class 不裸奔 */
  --pur:#7C3AED; --pur2:#9D6BF5; --pur-soft:#F2ECFF;
  --grn:#6B7280; --grn-soft:#EEF0F4;
  --red:#E5484D; --red-soft:#FFF0F1;
  --ty:#9b9aa6; --ty-soft:#EEF0F4; --dx:#6B7280; --dx-soft:#EEF0F4;
  --xl:#7C3AED; --xz:#6B7280; --mb:#9b9aa6;
  --amb:#9b9aa6; --amb-soft:#EEF0F4;
  --sh-1:0 1px 2px rgba(16,24,40,.04);
  --sh:0 1px 2px rgba(16,24,40,.04),0 3px 10px rgba(16,24,40,.035);
  --sh-2:var(--sh); --sh-3:0 6px 20px rgba(16,24,40,.09);
  --r-s:6px; --r-m:10px; --r-l:14px; --r-pill:999px;
  --sp:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#D9DEE8;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
.app{max-width:100%;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}

/* ---------- 顶栏（被工作台内联时自动隐藏） ---------- */
header{position:sticky;top:0;z-index:8;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px}
header .row{display:flex;align-items:center;gap:10px}
header .logo{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:14px;flex:none}
header .t{font-size:15px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .s{font-size:11px;color:var(--tx3);flex:none;font-weight:600}

/* ---------- 全局搜索条 ---------- */
.search{padding:14px 16px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.search .box{display:flex;gap:8px;max-width:620px}
.search input{flex:1;min-width:0;height:40px;border:1px solid var(--line2);background:var(--surface-2);border-radius:var(--r-s);padding:0 13px;font-size:14px;outline:none;color:var(--tx);transition:border-color .16s,box-shadow .16s}
.search input::placeholder{color:var(--tx3)}
.search input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.search button{flex:none;border:none;background:var(--brand);color:#fff;font-weight:700;font-size:14px;padding:0 20px;border-radius:var(--r-s);transition:opacity .16s}
.search button:hover{opacity:.9}
.hint{font-size:11px;color:var(--tx3);margin:8px 0 0;max-width:620px}
.app:not([data-view="search"]) .search{display:none}

/* ---------- L2 导航：与外层工作台同源的选中语言 ---------- */
.tabs{display:flex;gap:2px;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:7;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .tab{flex:0 0 auto;min-width:92px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:none;background:transparent;color:var(--tx2);font-size:13px;font-weight:700;padding:12px 14px;
  position:relative;white-space:nowrap;transition:color .16s}
.tabs .tab svg{width:16px;height:16px;flex:none}
.tabs .tab:hover{color:var(--brand)}
.tabs .tab.on{color:var(--brand);font-weight:800}
.tabs .tab.on:after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2.5px;border-radius:3px 3px 0 0;background:var(--brand)}

/* ---------- 面包屑 ---------- */
.qcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px 16px;font-size:11px;color:var(--tx3);background:var(--bg);border-bottom:1px solid var(--line)}
.qcrumb i{font-style:normal;color:#C7CDD8}
.qcrumb b{color:var(--tx);font-weight:800}

/* ---------- 内容容器 / 页头 ---------- */
.main{flex:1;padding:0 16px 44px;overflow-y:auto}
.qpage{padding:20px 2px 16px}
.qpage h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px;color:var(--tx)}
.qpage p{margin:5px 0 0;font-size:12.5px;color:var(--tx2);line-height:1.6}
.qpage .meta{margin-top:8px;font-size:11px;color:var(--tx3);font-weight:600}
.qpage .meta b{color:var(--tx2);font-weight:800}
.qsection{margin:0 0 20px;scroll-margin-top:78px}
.qsec-h{display:flex;align-items:center;gap:8px;margin:0 2px 10px;min-height:22px}
.qsec-h .no{width:20px;height:20px;border-radius:6px;background:#EEF0F4;color:var(--tx2);font-size:10px;font-weight:800;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.qsec-h h3{margin:0;font-size:14px;font-weight:800;letter-spacing:-.1px;color:var(--tx)}
.qsec-h .d{display:none}
.qsec-h .right{margin-left:auto;font-size:11px;color:var(--tx3);font-weight:700;white-space:nowrap;flex:none}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-1);padding:12px}
.empty{text-align:center;color:var(--tx3);padding:52px 20px;font-size:13px;line-height:1.8;background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r-m)}
.empty .ic{width:40px;height:40px;margin:0 auto 12px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--tx3);font-size:18px}
.foot{text-align:center;font-size:10.5px;color:var(--tx3);padding:16px;border-top:1px solid var(--line);line-height:1.7}

/* ---------- 搜索结果 ---------- */
.chooser{display:flex;flex-direction:column;gap:8px}
.chooser .ci{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;box-shadow:var(--sh);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:border-color .16s,transform .16s}
.chooser .ci:hover{border-color:var(--brand-line);transform:translateY(-1px)}
.chooser .nm{font-weight:800;font-size:14px}
.chooser .ph{font-size:11.5px;color:var(--tx3);margin-top:2px}
.chooser .badge{font-size:11px;background:#EEF0F4;color:var(--tx2);padding:4px 10px;border-radius:var(--r-pill);font-weight:700;flex:none}
.lv{font-size:10px;background:var(--brand-soft);color:var(--brand);padding:2px 8px;border-radius:var(--r-pill);font-weight:700;margin-left:6px;vertical-align:middle;white-space:nowrap}

/* ---------- L3 客户详情：sticky 身份条 + 锚点导航 ---------- */
.qdetail-head{position:sticky;top:0;z-index:6;background:var(--bg);padding:10px 0 8px;margin-bottom:14px}
.qident{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh);padding:12px 14px}
.qident .av{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:17px;font-weight:800;flex:none}
.qident .who{flex:1;min-width:0}
.qident .nm{font-size:16px;font-weight:800;line-height:1.2}
.qident .mt{font-size:11.5px;color:var(--tx3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qident .stat{display:flex;gap:16px;flex:none;margin-left:auto}
.qident .stat .s{text-align:center}
.qident .stat .s b{display:block;font-size:18px;font-weight:800;line-height:1.1;color:var(--tx);font-variant-numeric:tabular-nums}
.qident .stat .s span{display:block;font-size:10px;color:var(--tx3);font-weight:700;margin-top:2px}
.qanchor{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:4px;margin-top:8px;box-shadow:var(--sh-1)}
.qanchor::-webkit-scrollbar{display:none}
.qanchor a{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--tx2);padding:6px 15px;border-radius:var(--r-pill);text-decoration:none;cursor:pointer;transition:background .16s,color .16s}
.qanchor a:hover{background:var(--surface-2)}
.qanchor a.on{background:var(--brand);color:#fff}
.qanchor a.on:hover{background:var(--brand)}
.qdetail-body{max-width:900px}
.detail-grid{display:block}
.dcol-l,.dcol-r{min-width:0}
.dtop{margin-bottom:12px}
.mback{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);border:none;border-radius:var(--r-s);padding:7px 14px;margin:14px 0 0;cursor:pointer}
.mback:hover{background:var(--brand-line)}

/* ---------- 身份 / 统计小卡 ---------- */
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;box-shadow:var(--sh-1);margin-bottom:10px}
.mcard .top{display:flex;align-items:center;gap:12px}
.mcard .av{width:38px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:15px;font-weight:800;flex:none}
.mcard .nm{font-size:15px;font-weight:800}
.mcard .meta{font-size:12px;color:var(--tx2);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 18px}
.mcard .meta b{color:var(--tx);font-weight:700}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.ov .o{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 6px;text-align:center;box-shadow:var(--sh-1)}
.ov .o .n{font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--tx)}
.ov .o .l{font-size:11px;color:var(--tx3);margin-top:4px;font-weight:600}
.ov .o.u .n{color:var(--brand)} .ov .o.d .n{color:var(--tx2)} .ov .o.e .n{color:var(--tx3)}

/* ---------- 内容卡（统一白底、无渐变；左侧细色条只表语义） ---------- */
.prof,.cons,.speech,.tip,.histnote,.warnbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;box-shadow:var(--sh-1);margin-bottom:0}
.prof .pt,.cons .pt,.speech .pt{font-size:12.5px;font-weight:800;color:var(--tx);margin:0 0 12px;display:flex;align-items:center;gap:7px}
.prof .pt:before,.cons .pt:before,.speech .pt:before{content:"";width:3px;height:13px;border-radius:2px;background:var(--brand);flex:none}
.cons .pt:before{background:var(--oth)} .speech .pt:before{background:var(--oth)}
.prof .pt small,.speech .pt small{font-size:11px;font-weight:600;color:var(--tx3)}
.prof .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.prof .it .k{font-size:11px;color:var(--tx3);font-weight:600}
.prof .it .v{font-size:14px;font-weight:700;color:var(--tx);margin-top:2px;word-break:break-all;line-height:1.4}
.prof .it .v small{font-size:11px;font-weight:600;color:var(--tx3);margin-left:3px}
.pflag{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:var(--r-pill);margin-left:6px;vertical-align:middle}
.pflag.new{background:var(--warn-soft);color:var(--warn)}
.pflag.silent{background:var(--danger-soft);color:var(--danger)}
.cons .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.cons .sum .it .k{font-size:10.5px;color:var(--tx3);font-weight:600}
.cons .sum .it .v{font-size:14px;font-weight:800;color:var(--tx);margin-top:2px;font-variant-numeric:tabular-nums}
.cons .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cons .chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--line);color:var(--tx2)}
.cons .chip b{color:var(--tx);margin-left:4px;font-variant-numeric:tabular-nums}
.cons .plist{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow:auto}
.cons .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s)}
.cons .row .pd{font-size:12.5px;font-weight:600;color:var(--tx);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cons .row .pd small{font-size:10.5px;color:var(--tx3);font-weight:500;margin-left:5px}
.cons .row .pa{font-size:12.5px;font-weight:800;color:var(--tx);flex-shrink:0;font-variant-numeric:tabular-nums}
.cons .more{text-align:center;color:var(--tx3);font-size:11px;margin-top:8px}
.tip{background:#EEF0F4;border:1px solid var(--line2);color:var(--tx2);font-size:12.5px;line-height:1.7;margin-bottom:12px}
.tip.ok{background:var(--ok-soft);border-color:#C6EBDC;color:#0B7A58}
.histnote{background:var(--info-soft);border-color:#D5E5FC;border-left:3px solid var(--info);font-size:12px;color:var(--tx2);line-height:1.75;margin-bottom:12px}
.histnote b{color:var(--tx);font-weight:800}
.histnote .hb{display:inline-block;background:#fff;color:var(--info);font-size:10px;font-weight:800;padding:2px 9px;border-radius:6px;margin-right:6px}

/* ---------- 券卡（去斜条，改右上角状态徽标） ---------- */
.sec{margin-bottom:12px}
.sec .h{font-size:12.5px;font-weight:800;color:var(--tx2);margin:0 2px 9px;display:flex;align-items:center;gap:7px}
.sec .h .dot{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;box-shadow:var(--sh-1);margin-bottom:8px;position:relative;overflow:hidden}
.ccard .ln1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ccard .face{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:6px;flex:none}
.ccard .cn{font-size:13.5px;font-weight:800}
.ccard .cnt{font-size:11px;font-weight:800;color:var(--brand);background:var(--brand-soft);padding:2px 8px;border-radius:7px;margin-left:2px}
.ccard .sub{font-size:11.5px;color:var(--tx2);margin-top:6px;line-height:1.6}
.ccard .ln2{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--tx3)}
.ccard .ln2 .end{font-weight:700}
.ccard.due{border-color:var(--danger-line);background:var(--danger-soft)}
.ccard.due .ln2 .end{color:var(--danger);font-weight:800}
.ccard.used{opacity:.62}
.ccard.used:after,.ccard.exp:after{position:absolute;top:10px;right:12px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--tx3);transform:none}
.ccard.used:after{content:"已用";color:var(--ok);background:var(--ok-soft)}
.ccard.exp:after{content:"失效"}
.f-ty{background:var(--warn-soft);color:var(--warn)} .f-dx{background:var(--info-soft);color:var(--info)}
.f-xl{background:var(--brand-soft);color:var(--brand)} .f-xz{background:#EEF0F4;color:var(--tx2)}
.f-mb{background:var(--danger-soft);color:var(--danger)} .f-other{background:var(--surface-2);color:var(--tx2)}
.tag{grid-column:1/-1}

/* ---------- 话术 ---------- */
.speech .sc{position:relative;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:var(--r-s);padding:10px 72px 10px 12px;margin-bottom:8px;font-size:13px;line-height:1.75;color:var(--tx)}
.speech .sc .tag2{display:inline-block;font-size:10px;font-weight:800;color:var(--tx2);background:#EEF0F4;padding:2px 8px;border-radius:6px;margin-bottom:6px}
.speech .sc .copy{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;color:var(--tx2);background:#fff;border:1px solid var(--line2);border-radius:var(--r-s);padding:5px 11px;transition:.16s}
.speech .sc .copy:hover{background:var(--surface-2)}
.speech .sc .copy.ok{background:var(--ok);color:#fff;border-color:transparent}
.speech .maincopy,.speech .allcopy{display:block;width:100%;margin-top:10px;border-radius:var(--r-s);font-size:12.5px;font-weight:700;padding:9px;transition:.16s}
.speech .maincopy{border:none;background:var(--brand);color:#fff}
.speech .allcopy{border:1px solid var(--line2);background:#fff;color:var(--tx2)}
.speech .maincopy:hover{opacity:.88}
.speech .allcopy:hover{background:var(--surface-2)}

/* ---------- 列表行：主标题 / 副信息 / 状态 / 操作 ---------- */
.vlist{display:flex;flex-direction:column;gap:8px}
.vrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;box-shadow:var(--sh-1);cursor:pointer;transition:border-color .16s,box-shadow .16s}
.vrow:hover{border-color:var(--brand-line);box-shadow:var(--sh)}
.vrow .l1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.vrow .nm{font-weight:800;font-size:14.5px}
.vrow .ph{font-size:11.5px;color:var(--tx3);margin-top:2px}
.vrow .badge{font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:var(--r-pill);flex:none}
.vrow .badge.p1{background:var(--danger-soft);color:var(--danger)}
.vrow .badge.p2{background:var(--warn-soft);color:var(--warn)}
.vrow .badge.p3{background:var(--surface-2);color:var(--tx3)}
.vrow .reasons{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.vrow .rc{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--tx2)}
.vrow .rc.due{background:var(--danger-soft);color:var(--danger)}
.vrow .rc.new{background:var(--warn-soft);color:var(--warn)}
.vrow .rc.silent{background:var(--info-soft);color:var(--info)}
.vrow .rc.swap{background:#EEF0F4;color:var(--tx2)}
.vrow .rc.vip{background:var(--brand-soft);color:var(--brand)}
.vsub{font-size:11px;color:var(--tx3);margin:0 2px 9px}
.warnbar{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--danger);padding:12px 14px;margin-bottom:0;font-size:12.5px;color:var(--tx2);line-height:1.8}
.warnbar b{color:var(--tx);font-weight:800}
.vrow.visited{opacity:.6;background:var(--surface-2)}
.vrow.visited .nm:after{content:" · 已联系";font-size:10px;color:var(--ok);font-weight:700}
.vrow .acts{display:flex;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.vrow .acts .ab{flex:1;font-size:11.5px;font-weight:700;padding:7px 4px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--tx2);white-space:nowrap;transition:.16s}
.vrow .acts .ab:hover{border-color:var(--brand-line);color:var(--brand)}
.vrow .acts .ab.cp{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.vrow .acts .ab.vs.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.loadmore{display:block;width:100%;margin:12px 0 0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:9px;font-size:12.5px;font-weight:700;color:var(--brand);box-shadow:var(--sh-1)}

/* ---------- 筛选：统一一层容器语言 ---------- */
.filt{display:flex;flex-wrap:wrap;gap:7px;padding:0}
.filt .fc{font-size:12px;font-weight:700;padding:7px 13px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line2);color:var(--tx2)}

.empbar{display:flex;gap:7px;overflow-x:auto;flex-wrap:wrap;padding:0;scrollbar-width:none}
.empbar::-webkit-scrollbar{display:none}
.empbar .ec{flex:none;font-size:12px;font-weight:700;padding:7px 13px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line2);color:var(--tx2);white-space:nowrap}

.listbar .swbtn{font-size:11.5px;font-weight:700;color:var(--tx2);background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-s);padding:9px 12px;white-space:nowrap}
.listbar .swbtn.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-line)}

/* ---------- 首页 KPI / 快捷入口 ---------- */
.hkpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hkpis .k{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 10px;box-shadow:var(--sh);text-align:center}

.hkpis .k.hi b{color:var(--danger)} .hkpis .k.ok b{color:var(--tx2)}
.hkpis .k span{font-size:11px;color:var(--tx3);font-weight:700;display:block;margin-top:4px}
.hsec{display:flex;align-items:baseline;gap:8px;margin:0 2px 10px}
.hsec h3{font-size:14px;font-weight:800;margin:0}
.hsec span{font-size:11px;color:var(--tx3)}
.hquick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hquick button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:14px 6px;font-size:12px;font-weight:700;color:var(--tx2);box-shadow:var(--sh-1);transition:.16s}
.hquick button:hover{border-color:var(--brand-line);color:var(--brand);transform:translateY(-2px)}

/* ---------- 品类 · 三层分区：选品类 / 细化 / 结果 ---------- */

.c9tile.on:after{content:"✓";position:absolute;top:-6px;right:-5px;width:19px;height:19px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}

.c9mode button.on{background:var(--surface);color:var(--brand);box-shadow:var(--sh-1)}

.c9res{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px;position:static;background:transparent;padding:0}

.c9res input{flex:1;min-width:120px;height:36px;border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-pill);padding:0 13px;font-size:12.5px;outline:none;color:var(--tx)}
.c9res input:focus{border-color:var(--brand)}
.c9sort{display:inline-flex;gap:2px;background:var(--surface-2);border-radius:var(--r-pill);padding:3px}

.c9who{flex:1;min-width:0}
.c9who .nm{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c9who .mt{font-size:11px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c9pb{font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:var(--r-pill);flex:none}
.c9pb.p1{background:var(--danger-soft);color:var(--danger)}
.c9pb.p2{background:var(--warn-soft);color:var(--warn)}

.c9tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px;min-height:18px}
.c9tags .t{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--tx2)}
.c9tags .t.hit,.c9tags .t.due{background:var(--danger-soft);color:var(--danger)}
.c9tags .t.new{background:var(--warn-soft);color:var(--warn)}
.c9tags .t.silent{background:var(--info-soft);color:var(--info)}
.c9tags .t.swap{background:#EEF0F4;color:var(--tx2)}
.c9tags .t.vip{background:var(--brand-soft);color:var(--brand)}
.c9why{margin-top:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 10px}
.c9why .wh{font-size:10px;font-weight:800;color:var(--tx3);margin-bottom:5px;letter-spacing:.3px}
.c9why .wi{display:flex;gap:6px;font-size:11.5px;color:var(--tx2);line-height:1.6}
.c9why .wi .d{color:var(--tx3);flex:none;font-size:10.5px}
.c9why .wi .p{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c9why .wi .a{flex:none;font-weight:800;color:var(--tx)}
.c9stats{display:flex;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.c9stats .s{flex:1;min-width:0;text-align:center;border-right:1px solid var(--line)}
.c9stats .s:last-child{border-right:none}
.c9stats .s b{display:block;font-size:13.5px;font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums}
.c9stats .s.hi b{color:var(--danger)}
.c9stats .s span{display:block;font-size:10.5px;color:var(--tx3);font-weight:700;margin-top:2px}
.c9acts{display:flex;gap:7px;margin-top:9px}
.c9acts button{flex:1;min-height:34px;font-size:11.5px;font-weight:700;border-radius:var(--r-pill);border:1px solid var(--line2);background:var(--surface-2);color:var(--tx2)}
.c9acts button.cp{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.c9acts button.vs.on{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.c9acts button:hover{filter:brightness(.98)}
.c9empty{text-align:center;padding:36px 16px;background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r-m)}
.c9empty .ic{font-size:30px;color:var(--tx3)}
.c9empty h4{margin:9px 0 5px;font-size:14px}
.c9empty p{font-size:11.5px;color:var(--tx3);margin:0 0 14px}
.c9empty button{border:none;background:var(--brand);color:#fff;font-weight:700;font-size:12px;padding:9px 18px;border-radius:var(--r-pill)}
.c9more{display:block;width:100%;margin:12px 0 0;border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-pill);padding:11px;font-size:12.5px;font-weight:700;color:var(--brand)}
.c9note{font-size:11px;color:var(--tx3);margin:0;line-height:1.8;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px}

/* ---------- 数据时点 / 降级告警 ---------- */
.asof-line{margin-top:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;box-shadow:var(--sh-1)}
.asof-line .h{display:none}
.asof-line .i{font-size:11px;color:var(--tx3)}

.health-warn{background:var(--danger-soft);border:1px solid var(--danger-line);border-left:3px solid var(--danger);border-radius:var(--r-s);padding:11px 13px;margin:10px 0 0;font-size:11.5px;color:#9E2730;line-height:1.7}
.health-warn b{font-weight:800}
.health-warn ul{margin:6px 0 0 16px}

/* ---------- 响应式：桌面真正利用宽度，移动保持单列 ---------- */

/* ===== v3.1 层级收敛（2026-11-06 二次精修） ===== */
/* L3 详情整页：隐藏 L2 导航，sticky 身份条不再与导航抢 top:0 */
.app.detail-mode .tabs{display:none}
.app:not(.detail-mode) .qcrumb{display:none}

.qsection{scroll-margin-top:150px}

.hkpis .k:not(.hi):not(.ok) b{color:var(--tx)}

@media(min-width:768px){ .c9grid{grid-template-columns:repeat(9,minmax(0,1fr))} }
/* 手机：压缩顶部层数、分区标题不折行 */
@media(max-width:767px){
  .hint{display:none}

/* ===== v3.2 滚动模型修正 =====
   #main 的 overflow-y:auto 会创建一个「不滚动的滚动容器」，
   导致 position:sticky 参照它而非 iframe document，身份条滚动后消失。
   统一改为：iframe document 是唯一滚动容器，所有 sticky 相对它生效。 */
.main{overflow:visible}
.qdetail-head{position:sticky;top:0;z-index:9}
.tabs{position:sticky;top:0;z-index:8}

/* ==========================================================================
   会员查询 · 设计系统 v4（与外层工作台同一套语言，2026-11-07）
   交互主色由门店紫切到小红书红；紫只保留 header logo 品牌锚点。
   仅重定义 token，历史组件样式自动跟随；HTML / JS / 数据零改动。
   ========================================================================== */
:root{
  --accent:#FF2442; --accent-ink:#E11D38; --accent-deep:#B3122C;
  --accent-soft:#FFEDF0; --accent-line:#FFC9D0;
  --brand:var(--accent-ink); --brand2:var(--accent);
  --brand-soft:var(--accent-soft); --brand-line:var(--accent-line);
  --pur:var(--accent-ink); --pur2:var(--accent); --pur-soft:var(--accent-soft);
  --red:var(--accent-deep); --red-soft:#FFF4F5;
  --danger:var(--accent-deep); --danger-soft:#FFF4F5; --danger-line:var(--accent-line);
  --xl:#7C3AED;
  --r-s:10px; --r-m:14px; --r-l:18px; --r-pill:999px;
}
header .logo{background:#7C3AED}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--accent-ink);outline-offset:2px}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

</style>
</head>
<body>
<div class="app">
  <header>
    <div class="row">
      <span class="logo">星</span>
      <div class="t">会员权益查询</div>
      <span class="s" id="sub">李家村万达店</span>
    </div>
  </header>
  <div class="search">
    <div class="box">
      <input id="q" placeholder="手机号 / 姓名" autocomplete="off" inputmode="search">
      <button id="go">查询</button>

    <div class="hint">回车即可查询 · 支持姓名模糊与手机号尾号</div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-v="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>查会员</button>
    <button class="tab" data-v="pool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5.8"/><path d="M17 19a5.5 5.5 0 0 0-2.6-4.7"/></svg>客户池</button>
    <button class="tab" data-v="warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>回访预警</button>
    <button class="tab" data-v="cat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>按品类找</button>

<script>
// 被嵌入到星联会员 iframe 内时，隐藏自身顶栏，避免双层 header
if (window.self !== window.top) {
  var __h = document.querySelector('header');
  if (__h) __h.style.display = 'none';

const Q = __DATA_Q__;
const GN = Q.gname;
const FACE_CLS = {ty:'f-ty',dx:'f-dx',xl:'f-xl',xz:'f-xz',mb:'f-mb',other:'f-other'};

const $ = s=>document.querySelector(s);
const esc = s=>((s||'')+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const daysBetween=(a,b)=>{const d=(new Date(b)-new Date(a))/864e5;return Math.floor(d);};
/* 用浏览器本地日，不拿构建日当今天：隔天打开时临期窗口/换机年限会整体偏一天（审计修复） */
const todayStr = (()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();

// 历史消费客户：把真实消费记录包装成查询页可用对象（券相关字段全为空，不伪造）
function histMember(ph, v){
  return {_hist:true, mid:'h_'+ph, phone:ph, name:(v && v.name) || ph,
    level:'', emp:(((v||{}).emps||[])[0]||'未分配'), reg:'',
    n_unused:0, n_used:0, n_expired:0, unused:[], used:[], expired:[],
    consumption:v||{}, profile:null};
}
function findMemberByMid(mid){
  const a=Q.members.find(x=>x.mid===mid); if(a) return a;
  if(mid && mid.slice(0,2)==='h_'){
    const ph=mid.slice(2), v=(Q.history||{})[ph];
    if(v) return histMember(ph,v);
  }
  return null;
}
function searchMembers(q){
  q=(q||'').trim();
  if(!q) return [];
  const dig = /^\d+$/.test(q);
  const out = [];
  const seen = new Set();
  for(const m of Q.members){
    let hit=false;
    if(dig){
      if(m.phone===q) hit=true;
      else if(q.length>=3 && m.phone.endsWith(q)) hit=true;
    }else{
      if((m.name||'').includes(q)) hit=true;
    }
    if(hit && !seen.has(m.mid)){seen.add(m.mid);out.push(m);}
  }
  // 历史客户只在「有明确搜索词」时接入，不进任何列表/KPI/预警/品类
  for(const ph in (Q.history||{})){
    const v=Q.history[ph]; let hit=false;
    if(dig){ if(ph===q) hit=true; else if(q.length>=3 && ph.endsWith(q)) hit=true; }
    else if(((v&&v.name)||'').includes(q)) hit=true;
    const mid='h_'+ph;
    if(hit && !seen.has(mid)){seen.add(mid);out.push(histMember(ph,v));}
  }
  return out;
}

function mergeCoupons(list){
  // 同名同面额同说明合并为一卡，显示 ×N + 最早领取/最早到期
  const m = {};
  for(const c of list){
    const key = c.g+'|'+c.name+'|'+c.face+'|'+c.sub;
    if(!m[key]) m[key] = {g:c.g,name:c.name,face:c.face,sub:c.sub,count:0,pub:c.pub,end:c.end};
    const it = m[key];
    it.count++;
    if(c.pub && (!it.pub || c.pub < it.pub)) it.pub = c.pub;
    if(c.end && (!it.end || c.end < it.end)) it.end = c.end;
  }
  return Object.values(m);
}

function couponCard(c, kind){
  const fc = FACE_CLS[c.g]||'f-other';
  const dueCls = (kind==='unused' && c.end && daysBetween(todayStr,c.end)>=0 && daysBetween(todayStr,c.end)<=30)?' due':'';
  const statusCls = kind==='used'?' used':(kind==='expired'?' exp':'');
  /* end 为空 = 模板无有效期、无法推算，不能说成「长期有效」（数据真实性） */
  const endTxt = c.end? ('到期 '+esc(c.end) + (dueCls? ' · 临期!':'')) : '到期日未记录';
  const pubTxt = c.pub? ('领取 '+esc(c.pub.slice(5,16))) : '';
  const cnt = c.count>1? `<span class="cnt">×${c.count}</span>` : '';
  return `<div class="ccard ${dueCls} ${statusCls}">
    <div class="ln1">
      <span class="face ${fc}">${esc(c.face)}</span>
      <span class="cn">${esc(c.name)}</span>
      ${cnt}
    </div>
    ${c.sub?`<div class="sub">${esc(rulePlain(c.sub))}</div>`:''}
    <div class="ln2"><span>${pubTxt}</span><span class="end">${endTxt}</span></div>
  </div>`;
}

  const due = m.unused.filter(c=>c.end && daysBetween(todayStr,c.end)>=0 && daysBetween(todayStr,c.end)<=30);
  const fam = {};
  m.unused.forEach(c=>{const n=GN[c.g]||'其他';fam[n]=(fam[n]||0)+1;});

  let h='';

  }else if(m.unused.length){
    h += `<div class="tip ok">该会员有 <b>${m.unused.length}</b> 张未用券，暂无临期，可结合到店场景自然唤醒。</div>`;
  }
  if(top && m.unused.length){
    h += `<div class="tip ok">偏好券种：<b>${top[0]}</b>（占未用 ${top[1]} 张），回访话术可侧重此类权益。</div>`;

  }
  return h;
}

// ============ 机型系列参考（仅用于识别系列/世代，不承诺在售状态与价格） ============
// 数据真实性：以下名称来自历史消费记录里的系列归纳，不是实时在售清单；话术不得宣称「最新款/已上市/刚上」。
// gen = 该系列当前世代号；recommendUpgrade 只会往「同系列更新世代」或「跨档升级」推，绝不推荐比客户手里更老的机型
const LINEUP = {
  MATE:      {name:"华为 Mate 80 系列",  gen:80,  hint:"2026 旗舰·性能与卫星通信天花板"},
  PURA:      {name:"华为 Pura 80 系列",  gen:80,  hint:"2026 影像旗舰·超聚光镜头"},
  NOVA:      {name:"华为 nova 16 系列",  gen:16,  hint:"轻旗舰·人像与轻薄"},
  CHANGXIANG:{name:"华为 畅享 100 系列", gen:100, hint:"大屏长续航·入门首选"},
  WATCH:     {name:"华为 WATCH GT 6",    gen:6,   hint:"新一代穿戴"},
  MATEPAD:   {name:"华为 MatePad 系列",  gen:13,  hint:"新平板"},
  MATEBOOK:  {name:"华为 MateBook 系列", gen:14,  hint:"新笔记本"},
};
// 升级阶梯：畅享→nova→Pura→Mate（只升不降）
const TIER_UP = { CHANGXIANG:'NOVA', NOVA:'PURA', PURA:'MATE', MATE:null };
const PHONE_KEYS = ['MATE','PURA','NOVA','CHANGXIANG'];
function seriesKeyOf(raw){
  const s=(raw||'').toUpperCase();
  if(s.includes('MATE') && (s.includes('PAD')||s.includes('BOOK'))) return s.includes('PAD')?'MATEPAD':'MATEBOOK';
  if(s.includes('MATE')) return 'MATE';
  if(s.includes('PURA')) return 'PURA';
  if(s.includes('NOVA')) return 'NOVA';
  if(s.includes('CHANG')||s.includes('畅享')) return 'CHANGXIANG';
  if(s.includes('WATCH')||s.includes('GT')) return 'WATCH';
  return null;
}
// 机型后缀档位：基础=0 / Plus=1 / Pro=2 / Pro Max·Ultra·RS=3（用于防止把高配客户往低配基础款推）
function trimRank(s){
  const t=(s||'').toUpperCase();
  if(/PRO\s*MAX|ULTRA|RS|非凡大师/.test(t)) return 3;
  if(/PRO/.test(t)) return 2;
  if(/PLUS/.test(t)) return 1;
  return 0;
}
// 解析客户手里机型的（系列, 世代号, 档位）—— 升级方向判断的唯一依据
function ownedPhone(m){
  const pi=phonePurchaseInfo(m);
  if(!pi) return null;
  const series=seriesKeyOf(pi.prod);
  if(!series || !PHONE_KEYS.includes(series)) return null;
  /* 世代号只从系列名后面取，不从 AL00/VOL-AL10 之类的型号后缀里取（会把 X7 读成 10） */
  const gm=pi.prod.match(/(?:mate|pura|nova|畅享|pocket)\s*(?:x\s*)?(\d{1,3})/i);
  const gen=gm?parseInt(gm[1],10):0;
  return {series, gen, prod:pi.prod, trim:trimRank(pi.prod)};
}
// 升级推荐：只升不降（同系列更新世代·且客户非高配 → 否则跨档升级 → 已达顶端返回 null，绝不推更老/更低配）
function recommendUpgrade(m){
  const owned=ownedPhone(m);
  if(!owned) return null;
  const cur=LINEUP[owned.series];
  if(!cur) return null;
  // 客户是入门基础款且世代更老 → 同系列推新款（base→base 升级，安全）
  if(owned.gen < cur.gen && owned.trim===0){
    return {key:owned.series, mode:'same', name:cur.name, hint:cur.hint};
  }
  // 客户已是本系列当前款，或手里是高配(Pro/Pro Max/Ultra) → 跨档推更高一档，绝不推同系列基础款造成降级
  const upKey=TIER_UP[owned.series];
  if(upKey && LINEUP[upKey]){
    return {key:upKey, mode:'up', name:LINEUP[upKey].name, hint:LINEUP[upKey].hint,
            fromName:(LINEUP[owned.series]||{}).name};
  }
  return null;
}
// 从购买记录推算"上次买手机"的日期与年限（用友券无到期日，换机周期改用购买时间推算）
function phonePurchaseInfo(m){
  const cons=m.consumption||{}; let last=null, lastProd='';
  for(const x of (cons.purchases||[])){
    const pr=x.product||'';
    // 数据真实性：必须真的是手机（含系列/型号数字），排除配件、赠品、手提袋、贴膜套包。
    //    否则会把「华为-手提袋-小」当成手机，生成「系统升级/电池检测」这种假话术。
    const isPhone = /(mate|pura|nova|畅享|麦芒|pocket|折叠|手机|HUAWEI|华为)/i.test(pr)
      && /\d/.test(pr)
      && !/(膜|壳|套|贴|保|线|充|支架|book|pad|笔记本|平板|袋|包|盒|挂|礼|赠|卡|杯|伞|手提|耳机|freebuds|音箱|手表|watch|适配器)/i.test(pr);
    if(isPhone){
      if(x.date && (!last || x.date>last)){ last=x.date; lastProd=pr; }
    }
  }
  if(!last) return null;
  return {date:last, prod:lastProd, ageDays:daysBetween(last, todayStr)};
}
// 回访信号评分（预警/客户池/品类三视图共用）
function memberSignals(m){
  const p=m.profile||{};
  const reasons=[]; let score=0;
  const due=m.unused.filter(c=>c.end && daysBetween(todayStr,c.end)>=0 && daysBetween(todayStr,c.end)<=30)
            .sort((a,b)=>a.end.localeCompare(b.end));
  if(due.length){ score+=50; reasons.push({t:'临期券 '+due[0].end.slice(5)+'到期', cls:'due'}); }
  if(m.n_unused>=3){ score+=15; reasons.push({t:'有'+m.n_unused+'张券未用', cls:'vip'}); }
  if(p.regDays!=null && p.regDays<=30){ score+=30; reasons.push({t:'新客·'+p.regDays+'天', cls:'new'}); }
  if(p.silentDays!=null && p.silentDays>180){ score+=25; reasons.push({t:'沉睡·'+p.silentDays+'天', cls:'silent'}); }
  else if(p.silentDays!=null && p.silentDays>=90){ score+=10; reasons.push({t:'久未到店·'+p.silentDays+'天', cls:'silent'}); }
  const up=recommendUpgrade(m);
  const hasPhone = up && PHONE_KEYS.includes(up.key);
  const phoneInfo = phonePurchaseInfo(m);
  if(hasPhone && ((p.silentDays!=null && p.silentDays>90) || (phoneInfo && phoneInfo.ageDays>365))){ score+=20; reasons.push({t:'换机周期', cls:'swap'}); }
  return {score, reasons, due, up, hasPhone};
}

// ============ 销冠话术引擎（行业顶级回访方法论） ============
function fmtAmt(x){ return '¥'+Number(x||0).toLocaleString(); }
// 把数据库里的原始券规则翻成客户看得懂的白话（话术与券卡共用，不裸奔字段）
function rulePlain(sub){
  return (sub||'').replace(/^面额[^·]*·\s*/, '').replace(/·/g,'，').replace(/≤/g,'满').replace(/＞/g,'超').replace(/\/care\//g,'/').replace(/，$/,'');
}
function couponPlain(c){
  if(!c) return '';
  const face = c.face || '';
  const s = rulePlain(c.sub);
  if(face && s) return face+'（'+s+'）';
  return face || s;
}
// 称呼：姓名+哥/姐（微信习惯语序，而非「哥XXX」）
function greet(name, sex){
  const t = sex===2?'姐':(sex===1?'哥':'');
  return (name||'顾客')+t;
}
// 专属顾问：优先会员归属员工，否则取最近一笔消费的服务顾问，再否则门店默认
function advisorName(m){
  const e1=(m.emp&&!['未分配','未记录',''].includes(m.emp))?m.emp:null;
  if(e1) return e1;
  const ps=(m.consumption&&m.consumption.purchases)||[];
  let best=null;
  for(const x of ps){ if(x.emp&&!['未记录','未分配',''].includes(x.emp)){ if(!best||(x.date||'')>best.date) best=x; } }
  return best?best.emp:'李家村万达店';
}
function topPurchases(m,n){
  const ps=(m.consumption&&m.consumption.purchases)||[];
  return ps.slice().sort((a,b)=>(b.amt||0)-(a.amt||0)).slice(0,n||2);
}
// 生成该会员的全部回访话术（按场景优先级，最多3条）
function buildSpeech(m){
  const p=m.profile||{};
  const name=m.name||'顾客';
  const sex=p.sex;
  const greetName=greet(name, sex);
  const adv=advisorName(m);
  const cons=m.consumption||{};
  const sig=memberSignals(m);
  const up=sig.up;
  const phoneInfo=phonePurchaseInfo(m);
  const tp=topPurchases(m,2);
  const tpProd = tp[0]? (tp[0].product+(tp[0].amt?('（'+fmtAmt(tp[0].amt)+'）'):'')) : '';
  const tc=m.unused.find(c=>c.face)||m.unused[0];
  const couponDetail = tc ? couponPlain(tc) : '';
  const due=sig.due;
  const yrs = phoneInfo? Math.max(1,Math.round(phoneInfo.ageDays/365)) : 0;
  const intro = `${greetName}，我是您在李家村万达店的顾问${adv}，`;
  const sp=[];

  // A 临期券激活（补到期日后自动生效）
  if(due.length){
    let t=intro+`您那张${due[0].face}券 ${due[0].end.slice(5)} 就到期了，先别浪费。`;
    if(up&&sig.hasPhone) t+=`${tp.length?('您'+tpProd+'，'):''}${up.name}（${up.hint}）刚上市，以旧换新再叠这张券能省不少，给您留台样机来试试？`;
    else if(tp.length) t+=`您${tpProd}，正好带个配件或贴个膜用掉它~`;
    else t+=`有空来李家村万达店坐坐，我帮您用掉~`;
    sp.push({tag:'临期券激活', t, w:100});
  }
  // B 换机邀约（手机用≥1年 / 久未到店）—— 最强抓手（只升不降）
  if(up && sig.hasPhone && !due.length && ((p.silentDays!=null&&p.silentDays>90)||(phoneInfo&&phoneInfo.ageDays>365))){
    if(up.mode==='same'){
      const used = phoneInfo? (`您${phoneInfo.prod}（${phoneInfo.date}买的）用了快${yrs}年`) : '您之前的手机';
      sp.push({tag:'换机邀约', t:`${intro}${used}，正好该焕新啦！${up.name}（${up.hint}）可以作为换机参考，具体机型、活动与价格以门店当日为准；以旧换新、国补、厂补和您的会员券能否叠加也到店帮您核实。我帮您免费估个旧机价，您看这周还是下周方便？`, w:95});
    }else{ // mode='up'：跨档升级（客户已是本系列当前款，推更高一档）
      const curName = phoneInfo? phoneInfo.prod : (up.fromName||'您现在的手机');
      sp.push({tag:'换机邀约', t:`${intro}您现在用着${curName}，想体验再上一档的话，${up.name}（${up.hint}）可以作为参考，比您现在这档高一个层级——以旧换新怎么折、会员券能否叠加，到店我帮您按当日政策核实。我帮您免费估价、留台样机，您看这周还是下周方便？`, w:95});
    }
  }
  // C 新客培育（注册≤30天）
  if(p.regDays!=null && p.regDays<=30){
    sp.push({tag:'新客培育', t:`${greetName}，欢迎加入咱们星联会员！我是您在李家村万达店的顾问${adv}，您注册后账上有${m.n_unused}张券待激活，第一次来记得找我，咱手把手把权益用足。这两天店里有新品样机，您啥时候方便，我给您留个位？`, w:90});
  }
  // D 沉睡高价值召回（>180天 且有消费/多券）
  if(p.silentDays!=null && p.silentDays>180 && (tp.length || m.n_unused>=3)){
    const newHint = up? `${up.name}到了不少新款` : '华为新品到了不少';
    sp.push({tag:'沉睡召回', t:`${intro}好久没见您啦（${p.silentDays}天），整理客户档案想起${tpProd?('您之前买的'+tpProd):'您这位老客户'}，特意来问问最近用得还顺手不？最近${newHint}，老客户给您留了专属福利，有空来坐坐，我帮您把权益理一理？`, w:85});
  }
  // E 久未触达轻唤醒（90-180天）
  else if(p.silentDays!=null && p.silentDays>=90 && p.silentDays<=180){
    sp.push({tag:'久未触达', t:`${intro}好久没见您啦~ 最近店里有不少新品和会员专属活动，想着您是老客户，先给您留个信儿。有空随时来逛逛，我帮您看看有没有合适的？`, w:60});
  }
  // F 券包激活（≥3张未用，非沉睡召回时）—— 预算/入门客户先引导把券用在做配件上，升级作可选项，绝不推老款
  if(m.n_unused>=3 && !due.length && !(p.silentDays!=null && p.silentDays>180)){
    if(up && up.mode==='up'){
      const curName = phoneInfo? phoneInfo.prod : (up.fromName||'您现在的手机');
      sp.push({tag:'券包激活', t:`${intro}提醒下您会员账上还有${m.n_unused}张券没用${couponDetail?('，其中一张'+couponDetail):''}。您现在用的${curName}正好配个好膜、耳机或保护壳，这些都能用券抵；想体验升级的话，${up.name}（${up.hint}）刚到，以旧换新+券叠加也划算。您来逛逛，我帮您把券用掉？`, w:70});

  // I 日常维护（兜底）

  // J 补齐不同切入点（销冠总能找到话说：保证至少 3 个可选角度，权重低于主场景）

  }
  if(!hasTag('权益盘点')){
    const cd=couponDetail?('（'+couponDetail+'）'):'';
    sp.push({tag:'权益盘点', t:`${intro}这次不推新机，就帮您把会员权益理一理：账上${m.n_unused}张券${cd}，哪张适合买配件、哪张能叠到换机价里，我给您标清楚，到店直接刷，不白放过期。您方便时我发您一份清单？`, w:42});

  if(up && !hasTag('新品邀约')){

  // 去重 + 按权重降序 + 取前3
  const seen=new Set(); const uni=[];
  sp.sort((a,b)=>b.w-a.w).forEach(s=>{ if(!seen.has(s.tag)){seen.add(s.tag);uni.push(s);} });
  return uni.slice(0,3);
}

function copySpeech(btn){
  const txt=btn.parentNode.querySelector('.txt').innerText;
  const done=()=>{const o=btn.textContent;btn.textContent='已复制✓';btn.classList.add('ok');setTimeout(()=>{btn.textContent=o;btn.classList.remove('ok');},1500);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  }else fallbackCopy(txt,done);
}
function copyAllSpeech(btn){
  const card=btn.closest('.speech');
  const txt=Array.from(card.querySelectorAll('.sc .txt')).map(e=>e.innerText).join('\n\n');
  const done=()=>{const o=btn.textContent;btn.textContent='已复制全部✓';setTimeout(()=>{btn.textContent=o;},1500);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  }else fallbackCopy(txt,done);
}
// 复制一条主话术（最高优先级那条，可直接发企微）
function copyMainSpeech(btn){
  if(!currentMember) return;
  const list=currentMember._hist?histSpeech(currentMember):buildSpeech(currentMember);
  const txt=list.length?list[0].t:'';
  const done=()=>{const o=btn.textContent;btn.textContent='已复制主话术✓';setTimeout(()=>{btn.textContent=o;},1500);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  }else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{ if(document.execCommand('copy')===false) throw new Error('copy rejected'); done(); }
  catch(e){
    /* 复制失败不能假装成功：把文本框显示出来让用户手动复制 */
    ta.style.position='static';ta.style.opacity='1';ta.style.width='100%';ta.style.height='80px';
    ta.focus();ta.select();return;
  }
  document.body.removeChild(ta);
}

  out.push({tag:'权益核实 · 不承诺优惠', t:nm+'，我是'+adv+'。看到您之前在我们店有消费记录，提醒一句：会员账上的权益要当面登账号核一下才准，我这边不替您下结论。您哪天顺路过来，我帮您查还有没有能用的、以及以旧换新现在能抵多少，查完您再决定，不勉强。'});
  const cats=Object.entries(c.cat||{}).sort((a,b)=>((b[1].amt||0)-(a[1].amt||0)));
  if(cats.length){

const VISIT_KEY='mq_visited_v1';
let VISITED={};
try{ VISITED=JSON.parse(localStorage.getItem(VISIT_KEY)||'{}')||{}; }catch(e){ VISITED={}; }
function saveVisited(){ try{ localStorage.setItem(VISIT_KEY,JSON.stringify(VISITED)); }catch(e){} }
function isVisited(ph){ return !!VISITED[ph]; }
function dayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayVisitedN(){ const k=dayKey(); return Object.values(VISITED).filter(d=>d===k).length; }

  if(VISITED[ph]) delete VISITED[ph]; else VISITED[ph]=dayKey();

  else if(state.view==='search' && document.querySelector('.hkpis')) renderHome();

function catOfPurchase(x){
  const cl=(x.class||'').trim(), p=(x.product||'');
  const o=[];
  // 1) 贴膜：用友 class 已把各类钢化膜/镜头膜统一归「贴膜」，天然不误判成手机
  if(cl==='贴膜' || /贴膜套包|钢化膜|镜头膜|热弯全胶|权益膜|软膜|保护膜|高清膜|一体镜头膜/.test(p)) return ['贴膜'];
  // 2) 增值 / 合约（服务类，互斥）
  if(CLS_SVC[cl]) return [CLS_SVC[cl]];
  if(/星联优享|星联尊享|Care\+|碎屏保障|延保|服务包|保障服务|非MSC垫付/.test(p)) return ['增值'];
  if(/半成卡|单卡新入网|新入网|存费赠费|购机赠费|合约/.test(p)) return ['合约'];
  // 3) 配件不进九类（但三方配件里的真耳机/音箱仍算音频客户）
  if(/^(三方配件|配件)$/.test(cl) && /耳机|耳夹|音箱|Sound/i.test(p)) return ['音频'];
  if(/^(三方配件|保护壳类|电源类|鼠标类|键盘类|配件|其他类|二手良品|大疆|其他)$/.test(cl)) return [];
  if(/手提袋|袋-|保护壳|保护套|充电器|数据线|鼠标|键盘|支架/.test(p)) return [];
  if(/膜|壳|套|贴|钢化|镜头|保护/.test(p)) return [];
  // 4) 实物类：只用干净的 class 判，避免商品名里的机型词干扰
  if(/智慧屏|电视|Vision|MateTV/i.test(cl)) o.push('电视');
  if(/MateBook|笔记本/i.test(cl)) o.push('电脑');
  if(/MatePad|平板/i.test(cl)) o.push('平板');
  if(/FreeBuds|FreeClip|FreeArc|耳机|音箱|耳夹|Buds/i.test(cl)) o.push('音频');
  if(/WATCH|Watch|手环|穿戴|儿童手表|超新星手表|体脂秤|FIT|GT Runner|表带/i.test(cl)) o.push('穿戴');
  if(/Mate\s?\d|Mate ?X|Mate ?XT|Pura|nova|畅享|麦芒|Pocket|Flip|手机/i.test(cl)) o.push('手机');
  // 5) class 无有效机型时，用商品名兜底（此时已排除配件）
  if(!o.length){
    if(/智慧屏|Vision|MateTV/i.test(p)) o.push('电视');
    else if(/MateBook|笔记本/i.test(p)) o.push('电脑');
    else if(/MatePad/i.test(p)) o.push('平板');
    else if(/FreeBuds|FreeClip|FreeArc|耳机|音箱/i.test(p)) o.push('音频');
    else if(/WATCH|Watch|手环/i.test(p)) o.push('穿戴');
    else if(/Mate\s?\d|Pura|nova|畅享|麦芒|Pocket/i.test(p)) o.push('手机');
  }
  return o;
}

 '合约':[['新入网',/新入网|入网/i],['UIM/半成卡',/UIM|半成卡/i],['赠费活动',/赠费/i]],
 '贴膜':[['套包',/贴膜套包/i],['高清钢化膜',/高清|钢化膜/i],['镜头膜',/镜头膜/i],['权益膜',/权益膜/i],['热弯膜',/热弯/i]],
};
const c9State={sel:new Set(),mode:'or',subs:new Set(),sort:'priority',q:'',page:1,hideVisited:false,pageSize:24};
function ensureC9(){
  if(Q._c9ready) return;
  Q.members.forEach(m=>{
    const hit={};
    for(const x of ((m.consumption||{}).purchases||[])) for(const c of catOfPurchase(x)) (hit[c]=hit[c]||[]).push(x);
    m._c9=new Set(Object.keys(hit)); m._c9hit=hit;
  });
  Q._c9ready=true;
}
function c9Count(k){ let n=0; for(const m of Q.members) if(m._c9.has(k)) n++; return n; }
function c9Filtered(){
  const sel=[...c9State.sel];
  const arr=Q.members.filter(m=>{
    if(sel.length){
      const ok=c9State.mode==='and'? sel.every(c=>m._c9.has(c)) : sel.some(c=>m._c9.has(c));
      if(!ok) return false;
    }
    if(c9State.subs.size){
      const pool=[];
      for(const c of (sel.length?sel:CAT9_KEYS)) for(const x of (m._c9hit[c]||[])) pool.push(x);
      let ok=false;
      for(const key of c9State.subs){
        const [cat,label]=key.split('|');
        const def=(C9SUBS[cat]||[]).find(d=>d[0]===label);
        if(def && pool.some(x=>def[1].test((x.class||'')+' '+(x.product||'')))) { ok=true; break; }
      }
      if(!ok) return false;
    }
    if(c9State.hideVisited && isVisited(m.phone)) return false;
    const q=c9State.q.trim();
    if(q && !((m.name||'').includes(q)||String(m.phone||'').includes(q))) return false;
    return true;
  });
  arr.sort((a,b)=>{
    if(c9State.sort==='recent') return String((b.consumption||{}).last||'').localeCompare(String((a.consumption||{}).last||''));
    if(c9State.sort==='amount') return (Number((b.consumption||{}).total_amt)||0)-(Number((a.consumption||{}).total_amt)||0);
    return memberSignals(b).score-memberSignals(a).score;
  });
  return arr;
}
function c9Card(m){
  const sig=memberSignals(m), cons=m.consumption||{};
  const pb=sig.score>=50?'p1':(sig.score>=25?'p2':'p3');
  const pbt=sig.score>=50?'优先':(sig.score>=25?'建议':'可缓');
  const sel=[...c9State.sel];
  let pool=[];
  for(const c of (sel.length?sel:CAT9_KEYS)) for(const x of (m._c9hit[c]||[])) pool.push(x);
  if(!pool.length) pool=(cons.purchases||[]).slice();
  pool=pool.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,2);
  const why=pool.length? pool.map(x=>`<div class="wi"><span class="d">${esc(String(x.date||'').slice(5))}</span><span class="p">${esc(x.product||'')}</span><span class="a">${x.amt?('¥'+Number(x.amt).toLocaleString()):''}</span></div>`).join('')
                       : '<div class="wi"><span class="p">暂无消费明细（纯券会员）</span></div>';
  const tags=[...m._c9].filter(c=>CAT9_KEYS.includes(c)).slice(0,4)
    .map(c=>`<span class="t ${c9State.sel.has(c)?'hit':''}">${esc(c)}</span>`).join('');
  const sigTags=sig.reasons.slice(0,3).map(r=>`<span class="t ${r.cls||''}">${esc(r.t)}</span>`).join('');
  const vs=isVisited(m.phone);
  return `<div class="c9card ${vs?'visited':''}" data-mid="${m.mid}" data-ph="${esc(m.phone)}">
    <div class="c9hd2"><div class="c9av">${esc((m.name||'?').slice(0,1))}</div>
      <div class="c9who"><div class="nm">${esc(m.name||'')}${vs?' · 已联系':''}</div>
        <div class="mt">${esc(m.phone||'')} · ${esc(m.level||'')} · 顾问 ${esc(m.emp||'—')}</div></div>
      <span class="c9pb ${pb}">${pbt}</span></div>
    <div class="c9tags">${tags}${sigTags}</div>
    <div class="c9why"><div class="wh">${sel.length?'为什么被筛出（所选品类买过）':'最近买了什么'}</div>${why}</div>
    <div class="c9stats">
      <div class="s hi"><b>${m.n_unused||0}</b><span>未用券</span></div>
      <div class="s"><b>${cons.total_amt?('¥'+Number(cons.total_amt).toLocaleString()):'—'}</b><span>累计消费</span></div>
      <div class="s"><b>${esc(String(cons.last||'—').slice(5))}</b><span>最近到店</span></div>
    </div>
    <div class="c9acts">
      <button class="cp" data-act="cp">复制话术</button>
      <button class="vs ${vs?'on':''}" data-act="visit">${vs?'✓ 已联系':'标记已联系'}</button>
    </div>
  </div>`;
}
function c9RenderBar(){
  const box=document.querySelector('#c9barbox'); if(!box) return;
  const sel=[...c9State.sel];
  const chips=sel.length? sel.map(c=>`<span class="c9chip" data-rm="${esc(c)}">${esc(c)} <b>×</b></span>`).join('')
                        : '<span class="lb">未选品类 · 展示全部会员</span>';
  box.innerHTML=`<div class="c9bar"><span class="lb">已选</span>${chips}
    ${sel.length>=2?'<span class="c9mode"><button data-m="or">任一命中</button><button data-m="and">同时命中</button></span>':''}
    ${sel.length?'<button class="c9clear" id="c9clear">清空</button>':''}</div>`;
  box.querySelectorAll('.c9mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===c9State.mode));
  box.querySelectorAll('.c9chip').forEach(el=>el.addEventListener('click',()=>{
    c9State.sel.delete(el.dataset.rm);
    for(const s of [...c9State.subs]) if(!c9State.sel.has(s.split('|')[0])) c9State.subs.delete(s);
    c9State.page=1; c9Refresh();
  }));
  box.querySelectorAll('.c9mode button').forEach(b=>b.addEventListener('click',()=>{c9State.mode=b.dataset.m;c9State.page=1;c9Refresh();}));
  const cl=box.querySelector('#c9clear'); if(cl) cl.addEventListener('click',()=>{c9State.sel.clear();c9State.subs.clear();c9State.page=1;c9Refresh();});
}
function c9RenderSub(){
  const box=document.querySelector('#c9subbox'); if(!box) return;
  const cats=[...c9State.sel];
  if(!cats.length){ box.innerHTML=''; return; }
  let html='<div class="c9sub"><div class="st">再按具体系列收窄（可多选）</div><div class="row">';
  for(const cat of cats) for(const [label,re] of (C9SUBS[cat]||[])){
    const key=cat+'|'+label;
    let n=0;
    for(const m of Q.members) if((m._c9hit[cat]||[]).some(x=>re.test((x.class||'')+' '+(x.product||'')))) n++;
    html+=`<span class="sb ${c9State.subs.has(key)?'on':''}" data-sub="${esc(key)}">${esc(label)}<span class="n">${n}</span></span>`;
  }
  html+='</div></div>'; box.innerHTML=html;
  box.querySelectorAll('.sb').forEach(el=>el.addEventListener('click',()=>{
    const k=el.dataset.sub;
    if(c9State.subs.has(k)) c9State.subs.delete(k); else c9State.subs.add(k);
    c9State.page=1; c9Refresh();
  }));
}
function c9Bind(){
  document.querySelectorAll('.c9tile').forEach(el=>el.addEventListener('click',()=>{
    const k=el.dataset.c9;
    if(c9State.sel.has(k)) c9State.sel.delete(k); else c9State.sel.add(k);
    for(const s of [...c9State.subs]) if(!c9State.sel.has(s.split('|')[0])) c9State.subs.delete(s);
    c9State.page=1; c9Refresh();
  }));
  const q=document.querySelector('#c9q');
  q.addEventListener('input',()=>{c9State.q=q.value;c9State.page=1;c9Paint();});
  document.querySelectorAll('#c9sort button').forEach(b=>{
    b.classList.toggle('on',b.dataset.s===c9State.sort);
    b.addEventListener('click',()=>{
      c9State.sort=b.dataset.s; c9State.page=1;
      document.querySelectorAll('#c9sort button').forEach(x=>x.classList.toggle('on',x===b));
      c9Paint();
    });
  });
  const hv=document.querySelector('#c9hv');
  hv.classList.toggle('on',c9State.hideVisited);
  hv.textContent=c9State.hideVisited?'✓ 已隐藏已联系':'隐藏已联系';
  hv.addEventListener('click',()=>{
    c9State.hideVisited=!c9State.hideVisited; c9State.page=1;
    hv.classList.toggle('on',c9State.hideVisited);
    hv.textContent=c9State.hideVisited?'✓ 已隐藏已联系':'隐藏已联系';
    c9Paint();
  });
}
function c9Refresh(){
  document.querySelectorAll('.c9tile').forEach(el=>el.classList.toggle('on',c9State.sel.has(el.dataset.c9)));
  c9RenderBar(); c9RenderSub(); c9Paint();
}
function c9Paint(){
  const arr=c9Filtered();
  const lim=c9State.page*c9State.pageSize;
  const shown=arr.slice(0,lim), more=arr.length>lim;
  const num=document.querySelector('#c9num'); if(num) num.innerHTML=`命中 <b>${arr.length}</b> 人`;
  const flow=document.querySelector('#c9flow'); if(!flow) return;
  if(!shown.length){
    const sel=[...c9State.sel];
    let recover='换个品类或清空条件试试';
    if(sel.length>1){
      let best='',bestN=-1;
      for(const c of sel){
        c9State.sel.delete(c); const n=c9Filtered().length; c9State.sel.add(c);
        if(n>bestN){bestN=n;best=c;}
      }
      recover=`移除「${esc(best)}」可看到 ${bestN} 人`;
    }
    flow.innerHTML=`<div class="c9empty" style="grid-column:1/-1"><div class="ic">⌕</div><h4>没有符合条件的会员</h4><p>${recover}</p><button id="c9reset">清空条件</button></div>`;
    const r=document.querySelector('#c9reset');
    if(r) r.addEventListener('click',()=>{
      c9State.sel.clear();c9State.subs.clear();c9State.q='';
      const q=document.querySelector('#c9q'); if(q) q.value='';
      c9State.page=1; c9Refresh();
    });
  }else{
    flow.innerHTML=shown.map(c9Card).join('');
    flow.querySelectorAll('.c9card').forEach(el=>{
      el.addEventListener('click',()=>{const m=Q.members.find(x=>x.mid===el.dataset.mid); if(m) openMember(m,()=>renderCat());});
      el.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',e=>{
        e.stopPropagation();
        if(b.dataset.act==='cp') copyRowSpeech(el.dataset.ph,b);
        if(b.dataset.act==='visit') toggleVisited(el.dataset.ph,()=>renderCat());
      }));
    });
  }
  const mb=document.querySelector('#c9morebox');
  if(mb) mb.innerHTML=more?`<button class="c9more" id="c9more">继续加载（还有 ${arr.length-lim} 人）</button>`:'';
  const lm=document.querySelector('#c9more'); if(lm) lm.addEventListener('click',()=>{c9State.page++;c9Paint();});
}
function renderCat(){
  switchView('cat'); ensureC9(); detailBack=null;
  const grid=CAT9.map(c=>{
    const n=c9Count(c.k);
    return `<div class="c9tile ${c9State.sel.has(c.k)?'on':''} ${n?'':'zero'}" data-c9="${esc(c.k)}" title="${esc(c.d)}">
      <span class="ic">${c.ic}</span><span class="nm">${esc(c.k)}</span><span class="ct">${n} 人</span></div>`;
  }).join('');
  $('#main').innerHTML=`<div class="qpage">
      <h2>按品类找客户</h2>
      <p>九类基于用友零售单原始品类归类，可多选交叉、叠加系列子标签与优先级排序。</p>
      <div class="meta">消费记录截至 <b>${esc((Q.asOf||{}).consumption||'—')}</b> · 券数据 <b>${esc((Q.asOf||{}).coupons||'—')}</b></div>
    </div>
    <div class="qsection">
      <div class="qsec-h"><span class="no">01</span><h3>选择品类</h3><span class="d">可多选 · 数字为全量命中人数</span></div>
      <div class="c9hd"><span>九类互斥归类，配件不重复计入整机</span></div>
      <div class="c9grid" id="c9grid">${grid}</div>
    </div>
    <div class="qsection">
      <div class="qsec-h"><span class="no">02</span><h3>细化条件</h3><span class="d">已选条件回显与系列子标签</span></div>
      <div id="c9barbox"></div>
      <div id="c9subbox"></div>
    </div>
    <div class="qsection">
      <div class="qsec-h"><span class="no">03</span><h3>客户结果</h3><span class="d">可搜索、排序、隐藏已联系</span></div>
      <div class="c9res">
        <span class="num" id="c9num"></span>
        <input id="c9q" type="text" placeholder="姓名 / 手机号" value="${esc(c9State.q)}">
        <span class="c9sort" id="c9sort"><button data-s="priority">优先级</button><button data-s="recent">最近到店</button><button data-s="amount">消费额</button></span>
        <button class="hv" id="c9hv">隐藏已联系</button>
      </div>
      <div class="c9flow" id="c9flow"></div>
      <div id="c9morebox"></div>
    </div>
    <div class="qsection">
      <div class="qsec-h"><span class="no">04</span><h3>口径说明</h3><span class="d">数据边界与归类规则</span></div>
      <div class="c9note">口径：按用友零售单原始品类归类。「增值」=星联优享/尊享、Care+、碎屏、延保、权益与服务；「合约」=合约入网、UIM 卡、新入网赠费；「贴膜」=贴膜套包、钢化膜、镜头膜（配件不重复计入手机等品类）。胶囊数字为全量命中人数（一人可跨多类），选中后以「命中 N 人」为准。消费记录截至 ${esc((Q.asOf||{}).consumption || '—')}（券数据 ${esc((Q.asOf||{}).coupons || '—')}）。</div>
    </div>`;
  c9RenderBar(); c9RenderSub(); c9Bind(); c9Paint();
}

// ============ 今日工作台（查询首页） ============
// 分块真实数据时点：各链路时钟不同，不用页面构建时间冒充
function asofLine(){
  const a = Q.asOf || {};
  const stale = (d)=>{ if(!d || d==='—') return ' stale'; const t=Date.parse(d.replace(' ','T')); return (!isNaN(t) && Date.now()-t>3*864e5) ? ' stale' : ''; };
  const it = (n,v)=>`<span class="i${stale(v)}">${n} <b>${esc(v||'—')}</b></span>`;
  const H=(a.health||{}).blocks||{};
  const fails=Object.keys(H).filter(k=>H[k].status==='fail');
  const warn=fails.length?`<div class="health-warn"><b>本轮有 ${fails.length} 块数据没能更新</b>：当前显示的是旧数据，不是今天最新。<ul>${fails.map(k=>`<li>${esc(H[k].label||k)}：${esc(H[k].note||'拉取失败')}（${esc(H[k].at||'—')}）</li>`).join('')}</ul></div>`:'';
  return `<div class="asof-line"><span class="h">数据时点</span>`+
    /* 缺采集时刻时留空标红，不能拿构建时间冒充（全局红线） */
    it('券/会员', a.coupons || '—') +
    it('消费/九类/话术', a.consumption) +
    it('现金券', a.cash) +
    it('画像档案', a.profiles) +
    it('钢化膜', a.film) +
    it('本页构建', a.built || Q.generatedAt) + `</div>` + warn;
}
function renderHome(){
  switchView('search'); detailBack=null;
  const warn=Q.members.map(m=>({m,sig:memberSignals(m)})).filter(x=>x.sig.score>0).sort((a,b)=>b.sig.score-a.sig.score);

      <h2>查会员</h2>

      <div class="meta">在册 <b>${Q.members.length}</b> 位持券会员 · 另可搜 <b>${Q.history_count||0}</b> 位历史消费客户</div>
    </div>
    <div class="qsection">
      <div class="qsec-h"><span class="no">01</span><h3>今日概览</h3><span class="d">会员资产与跟进进度</span></div>
      <div class="hkpis">
        <div class="k hi"><b>${warn.length}</b><span>待回访会员</span></div>

    <div class="qsection">

      <div class="vlist">${top5.map(x=>vrow(x.m)).join('')}</div>

    <div class="qsection">
      <div class="qsec-h"><span class="no">03</span><h3>快捷入口</h3><span class="d">常用工作模式</span></div>
      <div class="hquick">
        <button onclick="renderWarn()"><b>01</b>全部预警</button>
        <button onclick="renderPool('全部')"><b>02</b>客户池</button>
        <button onclick="renderCat()"><b>03</b>按品类找</button>
        <button onclick="document.querySelector('#q').focus()"><b>04</b>查会员</button>
      </div>
    </div>
    <div class="qsection">
      <div class="qsec-h"><span class="no">04</span><h3>数据时点</h3><span class="d">各链路真实采集时刻 · 超 3 天标红</span></div>
      ${asofLine()}
    </div>`;

  bindVrows(()=>renderHome());
}

document.querySelectorAll('#tabs .tab').forEach(t=>t.addEventListener('click',()=>{
  const v=t.dataset.v;
  if(v==='search') renderHome();
  else if(v==='pool') renderPool('全部');
  else if(v==='warn') renderWarn();

renderHome();
